  buildScenes(addScene) {
    const S = { stroke: C.navy, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

    // =========================================================================
    // SCENE 2A (44.33 - 50.62s): Sunlit Binance Engineering Office + Google Search

    addScene(44.3333, 50.62, {

        dark: false, wall: C.paper, deskY: 730, timeLabel: 'JUNE 2026',

      // Whiteboard with wallet nodes flow diagram (kept cleanly left of Exhibit B)
      const wb = el('g', {}, g);
      wRect(wb, 515, 184, 375, 285, { rx: 10, fill: C.cream, ...S }, 201);
      el('rect', { x: 530, y: 200, width: 345, height: 245, rx: 4, fill: '#FBF7EE', stroke: C.navy, 'stroke-width': 3 }, wb);

      for (const [nx, ny, lbl, col] of [[545, 260, 'CORE', C.yellow], [662, 260, 'SIGN', C.mint], [778, 260, 'VAULT', C.pink]]) {

      const title = chars(g, 'JUNE · PATIENT ZERO', {

    // =========================================================================

    // =========================================================================
    addScene(50.62, 58.66, {
      dark: true,
      camFn: (t) => {

      const office = E_.decorOfficeRoom(g, {
        dark: true, wall: C.night, deskY: 750, timeLabel: 'LOCAL DEV',

      const title = chars(g, 'ROUTINE WORK', {
        x: 84, y: 148, size: 74, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.mint },

        shirt: C.blue, hair: C.orange, hairStyle: 'crop', glasses: true, badge: true, mode: 'desk', expression: 'smile',

      el('line', { x1: 485, y1: 768, x2: 472, y2: 722, stroke: C.red, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
      el('line', { x1: 505, y1: 768, x2: 518, y2: 725, stroke: C.mint, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);

      // X-Ray Sliding Bottom Drawer (behind upper installer window until 55.0s!)
      const xrayClip = el('clipPath', { id: 'xrayClip2B' }, g);
      el('rect', { x: 700, y: 575, width: 1030, height: 345 }, xrayClip);
      const xrayWrap = el('g', { 'clip-path': 'url(#xrayClip2B)' }, g);

      txt(xray, '0xCA FE BA BE  [TROJAN HOOK DETACHED]', { x: 765, y: 745, 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.pink });

      // Port socket on right side of drawer where worm burrows
      wRect(xray, 1525, 765, 145, 92, { rx: 8, fill: C.night2, stroke: C.yellow, 'stroke-width': 4 }, 214);
      txt(xray, '/usr/bin', { x: 1597, y: 818, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.yellow });

      // Animated Crimson & Gold Coiled Trojan Worm
      const worm = el('g', { filter: 'url(#boil)' }, xray);
      const wormSegs = [];
      for (let i = 0; i < 8; i++) {
        const segC = el('circle', {
          cx: 0, cy: 0, r: 22 - i * 1.4,
          fill: i % 2 === 0 ? C.red : C.yellow, stroke: C.navy, 'stroke-width': 5,
        }, worm);
        wormSegs.push(segC);
      }
      // Worm head eyes & fangs
      const wHead = el('g', {}, worm);
      el('circle', { cx: 0, cy: 0, r: 26, fill: C.red, ...S }, wHead);
      el('circle', { cx: -6, cy: -8, r: 6, fill: C.yellow }, wHead);
      el('circle', { cx: 10, cy: -8, r: 6, fill: C.yellow }, wHead);
      el('polygon', { points: '22,-6 36,-12 24,2', fill: C.cream, stroke: C.navy, 'stroke-width': 3 }, wHead);
      el('polygon', { points: '22,6 36,12 24,-2', fill: C.cream, stroke: C.navy, 'stroke-width': 3 }, wHead);

      // Upper Crisp INSTALLER.PKG Window
      const win = el('g', {}, g);
      wRect(win, 705, 225, 1020, 370, { rx: 14, fill: C.cream, ...S }, 215);
      el('rect', { x: 705, y: 225, width: 1020, height: 56, rx: 14, fill: C.blue, stroke: C.navy, 'stroke-width': 6 }, win);
      for (let i = 0; i < 3; i++) el('circle', { cx: 745 + i * 30, cy: 253, r: 9, fill: [C.red, C.yellow, C.mint][i], stroke: C.navy, 'stroke-width': 3 }, win);

      return (t) => {
        office.updateOffice(t);
        charsPop(title, t, 50.75);
        eng1.setState({
          lookX: 5, lookY: -2, headDy: Math.sin(t * 2.5) * 2,
          blink: t > 52.8 && t < 52.95,
        });

        const p = E.out(seg(t, 50.9, 54.4));
        progBar.setAttribute('width', Math.max(12, p * 744).toFixed(1));
        progPct.textContent = `${Math.round(p * 100)}%`;
        op(statusBadge, E.back(seg(t, 54.2, 54.6)));

        // X-ray drawer slides open at 55.0s -> 55.72s (ready & open for still 11.5s = 55.83s!)
        const xOpen = E.out(seg(t, 55.0, 55.72));
        tf(xray, 0, lerp(-325, 0, xOpen));

        // Animated Trojan worm slithering across drawer toward /usr/bin
        const slither = seg(t, 55.2, 58.6);
        const headX = lerp(915, 1510, slither);
        const headY = 805 + Math.sin(t * 10) * 18;
        tf(wHead, headX, headY, 1, Math.cos(t * 10) * 14);
        wormSegs.forEach((sc, idx) => {
          const lag = (idx + 1) * 28;
          sc.setAttribute('cx', (headX - lag).toFixed(1));
          sc.setAttribute('cy', (805 + Math.sin(t * 10 - (idx + 1) * 0.75) * 22).toFixed(1));

        stampAnim(stamp, t, 57.20, 1500, 560, -9);

    });

    // =========================================================================
    // SCENE 2C-1 (58.66 - 61.50s): Comic Toaster Gag ("Most companies would be toast")
    // VO: "Now most companies would already be toast right here."
    // =========================================================================
    addScene(58.66, 61.50, { dark: false }, (g) => {
      // Sunlit patterned kitchen wall + tile grid
      el('rect', { width: 1920, height: 1080, fill: C.paper }, g);
      halftone(g, { color: C.orange, step: 26, angle: 18, f: (x, y) => clamp(0.45 - Math.hypot(x - 960, y - 540) / 1000) });
      for (let tx = 0; tx < 1920; tx += 140) {
        for (let ty = 180; ty < 760; ty += 140) {
          el('rect', { x: tx + 4, y: ty + 4, width: 132, height: 132, rx: 6, fill: ((tx / 140 + ty / 140) % 2 === 0) ? C.cream : '#FFE6C4', stroke: C.navy, 'stroke-width': 3, opacity: 0.7 }, g);
        }
      }
      // Kitchen counter + cabinet front
      el('rect', { x: 0, y: 745, width: 1920, height: 32, fill: C.wood, stroke: C.navy, 'stroke-width': 6 }, g);
      el('rect', { x: 0, y: 777, width: 1920, height: 303, fill: C.woodDk, stroke: C.navy, 'stroke-width': 6 }, g);
      // Kitchen shelf & coffee jar on right
      wRect(g, 1340, 325, 420, 26, { rx: 6, fill: C.wood, ...S }, 221);
      wRect(g, 1410, 215, 95, 110, { rx: 10, fill: C.mint, ...S }, 222);
      txt(g, 'TEA', { x: 1457, y: 278, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.navy });
      wRect(g, 1560, 235, 120, 90, { rx: 8, fill: C.yellow, ...S }, 223);
      txt(g, 'SUGAR', { x: 1620, y: 288, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 18, 'font-weight': 800, fill: C.navy });

      const title = chars(g, 'MOST COMPANIES: TOAST', {
        x: 84, y: 148, size: 74, family: F.serif, fill: C.navy, shadow: { dx: 7, dy: 7, fill: C.orange },
      });

      // Burning Toast Slices springing out
      const toastG = el('g', { filter: 'url(#boil)' }, g);
      for (const [ox, rot] of [[-78, -9], [78, 8]]) {
        const sl = el('g', { transform: `translate(${ox} 0) rotate(${rot})` }, toastG);
        el('path', { d: 'M -85 45 C -105 15 -95 -65 -50 -75 C -15 -82 15 -82 50 -75 C 95 -65 105 15 85 45 L 78 135 L -78 135 Z', fill: '#3B2820', stroke: C.navy, 'stroke-width': 7 }, sl);
        el('path', { d: 'M -68 38 C -82 15 -76 -48 -42 -56 C -15 -62 15 -62 42 -56 C 76 -48 82 15 68 38 L 62 115 L -62 115 Z', fill: C.woodDk }, sl);
        // Comic X_X dizzy eyes on burnt toast
        el('line', { x1: -36, y1: -12, x2: -16, y2: 8, stroke: C.cream, 'stroke-width': 6, 'stroke-linecap': 'round' }, sl);
        el('line', { x1: -16, y1: -12, x2: -36, y2: 8, stroke: C.cream, 'stroke-width': 6, 'stroke-linecap': 'round' }, sl);
        el('line', { x1: 16, y1: -12, x2: 36, y2: 8, stroke: C.cream, 'stroke-width': 6, 'stroke-linecap': 'round' }, sl);
        el('line', { x1: 36, y1: -12, x2: 16, y2: 8, stroke: C.cream, 'stroke-width': 6, 'stroke-linecap': 'round' }, sl);
        el('ellipse', { cx: 0, cy: 36, rx: 18, ry: 12, fill: C.red, stroke: C.cream, 'stroke-width': 4 }, sl);
      }

      // Smoke puffs rising
      const smokeG = el('g', {}, g);
      for (const [sx, sy, sr] of [[875, 290, 34], [955, 240, 44], [1045, 285, 36]]) {
        el('circle', { cx: sx, cy: sy, r: sr, fill: C.slate, opacity: 0.45, stroke: C.navy, 'stroke-width': 4 }, smokeG);
      }

      // Retro Red & Chrome Toaster sitting on counter
      const toaster = el('g', { filter: 'url(#boil)' }, g);
      wRect(toaster, 735, 515, 450, 235, { rx: 46, fill: C.red, ...S }, 224);
      el('rect', { x: 775, y: 555, width: 370, height: 145, rx: 24, fill: '#F06072', opacity: 0.45 }, toaster);
      txt(toaster, 'TOASTED', { x: 960, y: 650, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 48, fill: C.yellow, stroke: C.navy, 'stroke-width': 4 });
      el('rect', { x: 1185, y: 595, width: 36, height: 22, rx: 6, fill: C.navy }, toaster);
      // Wall outlet & cord
      el('path', { d: 'M 735 695 Q 580 735 420 680', fill: 'none', stroke: C.navy, 'stroke-width': 8 }, g);
      wRect(g, 370, 625, 65, 86, { rx: 8, fill: C.cream, ...S }, 225);

      return (t) => {
        charsPop(title, t, 58.78);
        const pop = E.back(seg(t, 59.35, 59.9));
        tf(toastG, 960, lerp(590, 415, pop));
        tf(smokeG, Math.sin(t * 5) * 8, -(t - 59.4) * 38);
        op(smokeG, seg(t, 59.5, 60.0));
      };
    });

    // =========================================================================
    // SCENE 2C-2 (61.50 - 64.50s): Binance SOC War Room Erupts!
    // VO: "Except Binance actually catches it. Their security team spots the weird activity,"
    // =========================================================================
    addScene(61.50, 64.50, { dark: true }, (g) => {
      // Dark sky backing + wrap decorSOCWarRoom shifted +34px down so top-left headline has clean breathing room!
      el('rect', { width: 1920, height: 1080, fill: C.night }, g);
      const socWrap = el('g', { transform: 'translate(0 36)' }, g);
      const soc = E_.decorSOCWarRoom(socWrap);

      const title = chars(g, 'WAIT — CAUGHT IT!', {
        x: 84, y: 148, size: 74, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.red },
      });

      // Security Analysts spotting the alert on central screen
      const secL = personRig(g, {

        el('circle', { cx: -4, cy: -12, r: 5, fill: C.cream }, cg);
        return cg;
      }

      const card1 = mugCard(350, 348, 'ENG #1 // JUNE', 'PATIENT ZERO', { shirt: C.blue, hair: C.orange, hairStyle: 'crop', glasses: true, expression: 'worried' }, -4, C.red);
      const cardLead = mugCard(960, 232, 'WALLET LEAD', 'SYSTEM ARCHITECT', { shirt: C.night2, hair: C.navy, hairStyle: 'slick', tie: C.red, expression: 'neutral' }, 2, C.yellow);
      const card2 = mugCard(740, 632, 'ENG #2 // TARGET', 'WALLET CORE DEV', { shirt: C.mint, hair: C.navy, hairStyle: 'wavy', expression: 'smile' }, 3, C.mint);
      const card3 = mugCard(1490, 382, 'ENG #3 // INFRA', 'DEPLOY ACCESS', { shirt: C.pink, hair: C.navy, hairStyle: 'bob', badge: true, expression: 'neutral' }, -3, C.sky);

      // Extra corkboard index memos
      const memo = el('g', { transform: 'translate(1485 835) rotate(-3)' }, g);
      wRect(memo, -205, -80, 410, 160, { rx: 8, fill: C.cream, ...S }, 272);
      txt(memo, 'EXTRACTED DIRECTORY:', { x: 0, y: -32, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.red });
      txt(memo, '• 4 WALLET CORE ENGINEERS', { x: 0, y: 12, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.navy });
      txt(memo, '• NEXT TARGET: ENG #2', { x: 0, y: 48, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.blue });

      // Spotlight cone highlighting ENG #2
      const spot = el('circle', { cx: 740, cy: 760, r: 230, fill: 'none', stroke: C.yellow, 'stroke-width': 10, 'stroke-dasharray': '22 14' }, g);

      const stamp = makeStamp(g, 'NAMES LOCKED', C.red, 440, 118, 44);

      return (t) => {
        charsPop(title, t, 82.10);
        op(card1, E.back(seg(t, 82.1, 82.5)));
        op(cardLead, E.back(seg(t, 82.3, 82.7)));
        op(card2, E.back(seg(t, 82.5, 82.9)));
        op(card3, E.back(seg(t, 82.7, 83.1)));

        strings.forEach(({ line, len, i }) => {
          const p = E.out(seg(t, 82.8 + i * 0.25, 83.5 + i * 0.25));
          line.setAttribute('stroke-dashoffset', (len * (1 - p)).toFixed(1));
        });

        const sp = seg(t, 84.5, 85.2);
        op(spot, sp * (0.65 + 0.35 * Math.sin(t * 6)));
        stampAnim(stamp, t, 85.6, 1160, 825, -6);
      };
    });

    // =========================================================================
    // SCENE 2F-1 (88.22 - 91.60s): Evidence Locker Steel Cage
    // VO: "They didn't need that laptop anymore. They had names."
    // =========================================================================
    addScene(88.22, 91.60, { dark: true }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.night3 }, g);
      // Cold blue locker room pilasters
      for (let lx = 120; lx < 1920; lx += 340) {
        wRect(g, lx, 60, 260, 890, { rx: 8, fill: C.night, stroke: C.night2, 'stroke-width': 5 }, lx);
      }
      el('rect', { x: 0, y: 920, width: 1920, height: 160, fill: C.night2, stroke: C.navy, 'stroke-width': 6 }, g);
      el('polygon', { points: '860,0 1060,0 1380,920 540,920', fill: 'url(#patDotsBlue)', opacity: 0.36 }, g);

      const title = chars(g, 'THEY HAD NAMES', {
        x: 84, y: 148, size: 76, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.blue },
      });

      // Evidence Locker Steel Wire Cage
      const cage = el('g', {}, g);
      wRect(cage, 560, 230, 800, 690, { rx: 14, fill: C.night2, ...S }, 281);
      el('rect', { x: 590, y: 260, width: 740, height: 630, rx: 8, fill: '#0A0E22', stroke: C.slate, 'stroke-width': 5 }, cage);
      // Steel shelf + dead unplugged laptop inside cage (clear high-contrast frame + tag)
      el('rect', { x: 610, y: 690, width: 700, height: 22, fill: C.slate, stroke: C.navy, 'stroke-width': 4 }, cage);
      el('rect', { x: 750, y: 668, width: 420, height: 24, rx: 4, fill: C.cream, stroke: C.navy, 'stroke-width': 4 }, cage);
      wRect(cage, 785, 505, 350, 165, { rx: 10, fill: C.night2, stroke: C.cream, 'stroke-width': 6 }, 282);
      el('rect', { x: 805, y: 525, width: 310, height: 125, rx: 4, fill: '#060812' }, cage);
      txt(cage, 'OFFLINE // WIPED', { x: 960, y: 595, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.sky });
      // Wire bars over cage
      for (let bx = 650; bx <= 1290; bx += 64) el('line', { x1: bx, y1: 260, x2: bx, y2: 890, stroke: C.slate, 'stroke-width': 6, opacity: 0.78 }, cage);
      for (let by = 320; by <= 840; by += 95) el('line', { x1: 590, y1: by, x2: 1330, y2: by, stroke: C.slate, 'stroke-width': 5, opacity: 0.65 }, cage);
      // Heavy Brass Padlock + Evidence Tag
      el('rect', { x: 920, y: 410, width: 80, height: 74, rx: 10, fill: C.yellow, ...S }, cage);
      el('path', { d: 'M 936 410 L 936 377 A 24 24 0 0 1 984 377 L 984 410', fill: 'none', stroke: C.yellow, 'stroke-width': 10 }, cage);
      wRect(cage, 1080, 290, 210, 88, { rx: 8, fill: C.cream, ...S }, 283);
      txt(cage, 'EVIDENCE LOCK', { x: 1185, y: 342, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.red });

      // Shadowy gloved hand gripping "WALLET NAMES" dossier into darkness
      const shadowList = el('g', { filter: 'url(#boil)' }, g);
      wRect(shadowList, 1385, 435, 310, 365, { rx: 10, fill: C.cream, ...S }, 284);
      txt(shadowList, 'WALLET NAMES', { x: 1540, y: 492, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.red });
      for (const [ny, nm] of [[542, '• ENG #1 (JUNE)'], [592, '• ENG #2 (TARGET)'], [642, '• ENG #3 (INFRA)'], [692, '• WALLET LEAD']]) {
        txt(shadowList, nm, { x: 1415, y: ny, 'font-family': F.mono, 'font-size': 18, 'font-weight': 800, fill: C.navy });
      }
      // Sculpted dark gloved hand with thumb & 4 fingers gripping sheet edge
      el('path', { d: 'M 1648 538 C 1622 538 1618 572 1645 574 L 1650 578 C 1622 578 1620 606 1650 608 L 1650 612 C 1624 612 1622 640 1652 642 L 1655 646 C 1632 646 1632 672 1662 672 L 1735 668 L 1940 690 L 1940 535 L 1735 552 L 1678 518 C 1658 508 1642 522 1658 538 Z', fill: '#0B0F22', stroke: C.cream, 'stroke-width': 5, 'stroke-linejoin': 'round' }, shadowList);

      return (t) => {
        charsPop(title, t, 88.32);
        const pull = smooth(seg(t, 89.0, 91.4));
        tf(shadowList, pull * 210, 0);
        op(shadowList, 1 - pull * 0.45);
      };
    });

    // =========================================================================
    // SCENE 2F-2 (91.60 - 96.4583s): 3 Months of Silence Chamber (Metronome + JUL/AUG/SEP)
    // VO: "So they went quiet. For three whole months, nothing happened."
    // =========================================================================
    addScene(91.60, 96.4583, {
      dark: true,
      camFn: (t) => {
        const k = 1 + 0.03 * smooth(seg(t, 91.60, 96.46));
        return `translate(960 540) scale(${k.toFixed(4)}) translate(-960 -540)`;
      }
    }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.night3 }, g);
      // Tall stone gallery wall columns
      for (const px of [80, 1720]) wRect(g, px, 60, 120, 960, { rx: 6, fill: C.night, stroke: C.night2, 'stroke-width': 5 }, px);
      // Dusty Skylight Cone straight down center
      el('polygon', { points: '760,0 1160,0 1440,1080 480,1080', fill: 'url(#patDotsGold)', opacity: 0.34 }, g);
      el('rect', { x: 0, y: 950, width: 1920, height: 130, fill: C.night2, stroke: C.navy, 'stroke-width': 6 }, g);

      const title = chars(g, '3 MONTHS OF SILENCE', {
        x: 84, y: 148, size: 76, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.yellow },
      });

      // Three Oversized Wall Calendar Plates (JUL -> AUG -> SEP) across y: 235..465
      const plates = [
        { m: 'JUL', sub: 'MONTH 01', x: 375, tOn: 91.8 },
        { m: 'AUG', sub: 'MONTH 02', x: 960, tOn: 92.8 },
        { m: 'SEP', sub: 'MONTH 03', x: 1545, tOn: 93.8 },
      ].map((p, idx) => {
        const pg = el('g', {}, g);
        tf(pg, p.x, 345);
        wRect(pg, -165, -110, 330, 220, { rx: 14, fill: C.cream, ...S }, 290 + idx);
        wRect(pg, -165, -110, 330, 52, { rx: 14, fill: C.red, ...S }, 294 + idx);
        txt(pg, p.sub, { x: 0, y: -76, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 18, 'font-weight': 800, fill: C.cream });
        const lbl = txt(pg, p.m, { x: 0, y: 68, 'text-anchor': 'middle', 'font-family': F.serif, 'font-size': 112, 'font-weight': 900, fill: C.navy });
        return { pg, lbl, ...p };
      });

      // Giant Brass & Navy Metronome Pendulum centered cleanly below plates (y: 500..985)
      const metG = el('g', { filter: 'url(#boil)' }, g);
      tf(metG, 960, 745);
      // Stepped brass base plinth + top brass finial
      el('rect', { x: -215, y: 210, width: 430, height: 32, rx: 8, fill: C.yellow, stroke: C.navy, 'stroke-width': 6 }, metG);
      el('polygon', { points: '-115,-225 115,-225 190,210 -190,210', fill: C.night, stroke: C.yellow, 'stroke-width': 7 }, metG);
      el('polygon', { points: '-80,-225 0,-265 80,-225', fill: C.yellow, stroke: C.navy, 'stroke-width': 5 }, metG);
      el('rect', { x: -48, y: -195, width: 96, height: 325, rx: 8, fill: C.night3, stroke: C.slate, 'stroke-width': 4 }, metG);
      // Center tick markings
      for (let y = -160; y <= 90; y += 45) el('line', { x1: -28, y1: y, x2: 28, y2: y, stroke: C.yellow, 'stroke-width': 4 }, metG);
      // Swinging Brass Pendulum Arm pivoting at bottom (0, 145)
      const armG = el('g', {}, metG);
      el('line', { x1: 0, y1: 145, x2: 0, y2: -215, stroke: C.yellow, 'stroke-width': 12, 'stroke-linecap': 'round' }, armG);
      el('polygon', { points: '0,-155 44,-115 0,-75 -44,-115', fill: C.yellow, stroke: C.navy, 'stroke-width': 5 }, armG);
      el('circle', { cx: 0, cy: 145, r: 18, fill: C.yellow, stroke: C.navy, 'stroke-width': 5 }, metG);
      el('rect', { x: -66, y: 170, width: 132, height: 28, rx: 4, fill: C.yellow, stroke: C.navy, 'stroke-width': 3 }, metG);
      txt(metG, 'SILENT', { x: 0, y: 190, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 16, 'font-weight': 800, fill: C.navy });

      txt(g, 'ZERO NETWORK ACTIVITY · 90 DAYS', { x: 960, y: 1028, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.yellow });

      return (t) => {
        charsPop(title, t, 91.70);
        // Slow solemn pendulum swing
        const ang = Math.sin((t - 91.60) * 2.15) * 26;
        armG.setAttribute('transform', `rotate(${ang.toFixed(2)} 0 145)`);

        plates.forEach(({ pg, tOn }) => {
          const on = E.back(seg(t, tOn, tOn + 0.45));
          op(pg, 0.22 + 0.78 * clamp(on));
          tf(pg, pg === plates[0].pg ? 375 : pg === plates[1].pg ? 960 : 1545, 345, 0.88 + 0.12 * clamp(on));
        });
      };
    });
  }
});
