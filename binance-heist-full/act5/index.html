<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binance $6.3B Heist — Act 5 (Level-10 Halftone Dossier)</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>

<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs></defs>
  <g clip-path="url(#frameClip)">
    <g id="cam"><g id="world"></g></g>
    <g id="hud"></g>
    <g id="wipe"></g>
    <rect id="flash" width="1920" height="1080" fill="#FFFFFF" opacity="0"/>

<script src="shared/engine.js"></script>
<script>
const E_ = window.Engine;
const { C, F, el, txt, tf, op, show, clamp, seg, lerp, smooth, E, wRect, wLine, chars, charsPop, halftone, makeStamp, stampAnim, billNote, personRig, mountCapture } = E_;

E_.createStage({
  actNum: 5,
  actTitle: 'THE 20-MINUTE DRAIN & FREEZE RACE',
  actOffset: 6530 / 24, // 272.0833s exact 24fps
  frames: 2542,         // 272.0833s -> 378.0000s (105.9167s)
  assets: [
    'captures/cap_07_tx_drain_feed.png',
    'captures/cap_08_tether_freeze_alert.png',
  ],
  wipes: [
    [283.06, C.yellow],
    [301.54, C.paper],
    [317.18, C.red],
    [334.34, C.orange],
    [359.02, C.cream],
  ],
  shakes: [
    [272.80, 22, 0.34],
    [283.60, 16, 0.28],
    [297.50, 18, 0.30],
    [323.50, 11, 0.18],
    [324.20, 11, 0.18],
    [324.90, 11, 0.18],
    [325.60, 13, 0.20],
    [328.50, 18, 0.28],
    [355.20, 22, 0.36],
    [371.20, 10, 0.18],
    [372.40, 10, 0.18],
    [373.60, 12, 0.20],
  ],
  flashes: [
    [272.80, 0.40, 0.24],
    [283.60, 0.34, 0.20],
    [355.20, 0.42, 0.26],
  ],
  hudCues: [
    [272.08, '8:05 PM · LAUNCH'],
    [283.06, '8:20 PM · ETH MATCH'],
    [291.50, '03:24 · $1.6B SWEPT'],
    [301.54, '$5K VS $6.3B'],
    [317.18, 'CRISIS WAR ROOM'],
    [322.50, 'EMERGENCY BRAKES'],
    [334.34, 'BEAT THE FREEZE'],
    [343.20, 'DEFI LAUNDRY'],
    [350.00, '12:10 AM · CUT OFF'],
    [359.02, 'FINAL SCOREBOARD'],
  ],

  buildScenes(addScene) {
    const S = { stroke: C.navy, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

    function drawGear(parent, cx, cy, r, teeth, fill, hubFill = C.cream) {
      const g = el('g', {}, parent);
      tf(g, cx, cy);
      for (let i = 0; i < teeth; i++) {
        el('rect', {
          x: -10, y: -r - 15, width: 20, height: 22, rx: 4,
          fill, stroke: C.navy, 'stroke-width': 5,
          transform: `rotate(${(i * 360 / teeth).toFixed(1)})`
        }, g);
      }
      el('circle', { cx: 0, cy: 0, r, fill, stroke: C.navy, 'stroke-width': 6 }, g);
      el('circle', { cx: 0, cy: 0, r: r * 0.62, fill: 'none', stroke: C.navy, 'stroke-width': 4, opacity: 0.45 }, g);
      el('circle', { cx: 0, cy: 0, r: r * 0.28, fill: hubFill, stroke: C.navy, 'stroke-width': 5 }, g);
      return g;
    }

    function ethDiamond(parent, x, y, sc = 1, fill = C.sky) {
      const g = el('g', {}, parent);
      tf(g, x, y, sc);
      el('polygon', { points: '0,-24 16,0 0,8 -16,0', fill, stroke: C.navy, 'stroke-width': 4, 'stroke-linejoin': 'round' }, g);
      el('polygon', { points: '0,24 16,4 0,12 -16,4', fill: C.mint, stroke: C.navy, 'stroke-width': 4, 'stroke-linejoin': 'round' }, g);
      return g;
    }

    function btcCoin(parent, x, y, r = 24) {
      const g = el('g', {}, parent);
      tf(g, x, y);
      el('circle', { cx: 0, cy: 0, r, fill: C.yellow, stroke: C.navy, 'stroke-width': 4.5 }, g);
      el('circle', { cx: 0, cy: 0, r: r * 0.72, fill: 'none', stroke: C.orange, 'stroke-width': 3 }, g);
      txt(g, '₿', { x: 0, y: r * 0.34, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': Math.round(r * 1.1), 'font-weight': 800, fill: C.navy });
      return g;
    }

    // =========================================================================
    // SCENE 5A (272.08 - 283.06s): Main Breaker Slam -> 10-Chain Conduit Atrium
    // VO: "At 8:05 pm, they flipped the switch. Funds start leaving Binance across 10 blockchains at once. XRP, Bitcoin, Tron, Solana, Ethereum."
    // =========================================================================
    addScene(272.0833, 283.06, { dark: true }, (g) => {
      // ---- BEAT 1 (272.08 - 275.00s): Heavy Steel Breaker Panel & Main Switch Slam ----
      const b1 = el('g', {}, g);
      el('rect', { width: 1920, height: 1080, fill: C.night3 }, b1);
      halftone(b1, { color: C.red, step: 26, angle: 16, f: (x, y) => clamp(0.45 - Math.hypot(x - 960, y - 540) / 860) });
      for (let x = 160; x < 1920; x += 320) wLine(b1, x, 0, x, 1080, { stroke: C.night2, 'stroke-width': 4 }, x);

      const t1 = chars(b1, '8:05 PM · SWITCH FLIPPED', {
        x: 84, y: 150, size: 74, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.red },
      });

      // Heavy Industrial Steel Breaker Box
      wRect(b1, 560, 220, 800, 740, { rx: 22, fill: C.slate, stroke: C.cream, 'stroke-width': 8 }, 501);
      el('rect', { x: 590, y: 250, width: 740, height: 680, rx: 14, fill: C.night2, stroke: C.navy, 'stroke-width': 6 }, b1);
      el('rect', { x: 630, y: 280, width: 660, height: 70, rx: 8, fill: C.night3, stroke: C.yellow, 'stroke-width': 4 }, b1);
      txt(b1, 'MAIN OUTBOUND BREAKER // 10 CHAINS', { x: 960, y: 325, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 25, 'font-weight': 800, fill: C.yellow });
      // Danger stripes around switch pit
      el('rect', { x: 830, y: 390, width: 260, height: 420, rx: 14, fill: 'url(#patStripeDanger)', ...S }, b1);
      el('rect', { x: 865, y: 425, width: 190, height: 350, rx: 10, fill: C.night3, ...S }, b1);
      txt(b1, 'OFF', { x: 960, y: 472, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 28, 'font-weight': 800, fill: C.slate });
      txt(b1, 'DRAIN ON', { x: 960, y: 748, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 28, 'font-weight': 800, fill: C.red });

      // Animated Colossal Red Breaker Lever Arm + Gripping Hand (upright text, clean vertical throw!)
      const leverShaft = el('rect', { x: 938, y: 430, width: 44, height: 170, rx: 10, fill: C.cream, ...S }, b1);
      const leverHandle = el('g', { filter: 'url(#boil)' }, b1);
      el('rect', { x: -155, y: -32, width: 310, height: 64, rx: 16, fill: C.red, stroke: C.navy, 'stroke-width': 8 }, leverHandle);
      const leverTxt = txt(leverHandle, 'PULL', { x: -24, y: 12, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 34, fill: C.cream });
      el('path', { d: 'M 95 -44 C 145 -52 195 -28 188 18 L 135 38 L 95 22 Z', fill: '#0A0D1A', stroke: C.cream, 'stroke-width': 5 }, leverHandle);

      // ---- BEAT 2 (275.00 - 283.06s): Giant 10-Chain Conduit Atrium ----
      const b2 = el('g', {}, g);
      el('rect', { width: 1920, height: 1080, fill: C.night }, b2);
      halftone(b2, { color: C.night2, step: 26, angle: 16, f: (x, y) => 0.56 - Math.hypot(x - 960, y - 500) / 1450 });
      for (let x = 180; x <= 1740; x += 260) {
        wLine(b2, x, 0, x, 870, { stroke: C.night2, 'stroke-width': 4 }, x);
      }
      el('rect', { x: 0, y: 0, width: 1920, height: 74, fill: C.night3, stroke: C.navy, 'stroke-width': 5 }, b2);
      for (let x = 60; x < 1920; x += 180) {
        el('line', { x1: x, y1: 0, x2: x + 90, y2: 74, stroke: C.night2, 'stroke-width': 5 }, b2);
        el('line', { x1: x + 90, y1: 74, x2: x + 180, y2: 0, stroke: C.night2, 'stroke-width': 5 }, b2);
      }
      // Single overhead lamp clear of headline & banner + right CCTV camera
      el('polygon', { points: '1494,74 1546,74 1760,870 1280,870', fill: 'url(#patDotsGold)', opacity: 0.25 }, b2);
      el('line', { x1: 1520, y1: 0, x2: 1520, y2: 112, stroke: C.cream, 'stroke-width': 4 }, b2);
      el('path', { d: 'M 1470 134 C 1478 98 1562 98 1570 134 Z', fill: C.yellow, ...S }, b2);
      const camG = el('g', {}, b2);
      el('rect', { x: 1650, y: 88, width: 20, height: 44, fill: C.slate, ...S }, camG);
      el('polygon', { points: '1660,110 1568,136 1578,172 1670,146', fill: C.cream, ...S }, camG);
      const camLed = el('circle', { cx: 1590, cy: 144, r: 6, fill: C.red }, camG);
      // Perspective floor
      el('rect', { x: 0, y: 870, width: 1920, height: 210, fill: C.night3 }, b2);
      el('rect', { x: 0, y: 858, width: 1920, height: 16, fill: 'url(#patStripeDanger)', stroke: C.navy, 'stroke-width': 4 }, b2);
      for (let i = -5; i <= 5; i++) {
        el('line', { x1: 960 + i * 165, y1: 874, x2: 960 + i * 310, y2: 1080, stroke: C.night2, 'stroke-width': 3 }, b2);
      }

      const t2 = chars(b2, '10 CHAINS AT ONCE', {
        x: 84, y: 150, size: 76, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.yellow },
      });

      wRect(b2, 875, 88, 575, 48, { rx: 8, fill: C.navy, stroke: C.yellow, 'stroke-width': 4 }, 502);
      txt(b2, 'ALL 10 NETWORK CONDUITS // WIDE OPEN', {
        x: 1162, y: 119, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.yellow,
      });

      // Left Distribution Core: BINANCE OUTFLOW CORE
      wRect(b2, 95, 240, 405, 630, { rx: 16, fill: C.blue, stroke: C.cream, 'stroke-width': 7 }, 503);
      el('rect', { x: 125, y: 268, width: 345, height: 64, rx: 8, fill: C.night3, stroke: C.yellow, 'stroke-width': 4 }, b2);
      txt(b2, 'BINANCE OUTFLOW CORE', { x: 297, y: 308, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.yellow });
      el('circle', { cx: 297, cy: 560, r: 125, fill: C.night3, stroke: C.yellow, 'stroke-width': 9 }, b2);
      el('circle', { cx: 297, cy: 560, r: 78, fill: C.red, stroke: C.cream, 'stroke-width': 5 }, b2);
      txt(b2, 'SURGE', { x: 297, y: 571, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 32, fill: C.cream });

      // Right Architectural Manifold Housing 10 Pipes (5 Hero Named Chains + 5 Companion Chains)
      wRect(b2, 1345, 165, 505, 725, { rx: 16, fill: C.night2, stroke: C.cream, 'stroke-width': 6 }, 504);

      const CHAINS = [
        { name: 'XRP',      hero: true,  col: C.sky,    cue: 278.5 },
        { name: 'BNB',      hero: false, col: C.orange, cue: 276.0 },
        { name: 'BITCOIN',  hero: true,  col: C.yellow, cue: 279.2 },
        { name: 'USDT',     hero: false, col: C.mint,   cue: 276.0 },
        { name: 'TRON',     hero: true,  col: C.red,    cue: 279.9 },
        { name: 'AVAX',     hero: false, col: C.pink,   cue: 276.0 },
        { name: 'SOLANA',   hero: true,  col: C.mint,   cue: 280.6 },
        { name: 'ADA',      hero: false, col: C.sky,    cue: 276.0 },
        { name: 'ETHEREUM', hero: true,  col: C.pink,   cue: 281.3 },
        { name: 'LINK',     hero: false, col: C.yellow, cue: 276.0 },
      ];
      const pipes = CHAINS.map((ch, i) => {
        const pg = el('g', {}, b2);
        const y = 205 + i * 69;
        const pathD = `M 422 560 C 780 560 980 ${y} 1375 ${y}`;
        el('path', { d: pathD, fill: 'none', stroke: C.navy, 'stroke-width': ch.hero ? 26 : 18, 'stroke-linecap': 'round' }, pg);
        el('path', { d: pathD, fill: 'none', stroke: ch.col, 'stroke-width': ch.hero ? 14 : 9, 'stroke-linecap': 'round' }, pg);
        const p1 = el('circle', { cx: 422, cy: 560, r: ch.hero ? 11 : 8, fill: C.cream, stroke: C.navy, 'stroke-width': 4 }, pg);
        const p2 = el('circle', { cx: 422, cy: 560, r: ch.hero ? 10 : 7, fill: C.yellow, stroke: C.navy, 'stroke-width': 3 }, pg);
        const boxW = ch.hero ? 430 : 280;
        const boxX = ch.hero ? 1375 : 1450;
        const hdr = el('rect', {
          x: boxX, y: y - (ch.hero ? 26 : 21), width: boxW, height: ch.hero ? 52 : 42,
          rx: 10, fill: ch.col, stroke: C.navy, 'stroke-width': ch.hero ? 6 : 4
        }, pg);
        txt(pg, ch.name, {
          x: boxX + boxW / 2, y: y + (ch.hero ? 11 : 8),
          'text-anchor': 'middle', 'font-family': ch.hero ? F.bagel : F.mono,
          'font-size': ch.hero ? 30 : 21, 'font-weight': 800, fill: C.navy,
        });
        return { pg, p1, p2, hdr, y, ch, i };
      });

      const bills = Array.from({ length: 18 }, (_, i) => ({ g: billNote(b2), i }));

      return (t) => {
        const beat2 = t >= 275.00;
        show(b1, !beat2);
        show(b2, beat2);

        if (!beat2) {
          charsPop(t1, t, 272.20);
          const slam = E.in(seg(t, 272.45, 272.82));
          const hy = lerp(420, 770, slam);
          tf(leverHandle, 960, hy);
          leverShaft.setAttribute('y', Math.min(600, hy).toFixed(1));
          leverShaft.setAttribute('height', Math.max(12, Math.abs(hy - 600)).toFixed(1));
          leverTxt.textContent = slam > 0.7 ? 'ENGAGED!' : 'PULL';
        } else {
          charsPop(t2, t, 275.15);
          op(camLed, (Math.floor(t * 4) % 2) ? 1 : 0.25);
          bills.forEach(({ g: bg, i }) => {
            const cyc = ((t - 275.0) * 1.45 + i * 0.14) % 1.2 / 1.2;
            const x = lerp(340, 1340, cyc);
            const y = 560 + Math.sin(cyc * Math.PI * 2 + i) * 165 + (i - 9) * 18 * cyc;
            tf(bg, x, y, 0.88, cyc * 65 - 32);
          });
          pipes.forEach(({ p1, p2, hdr, y, ch, i }) => {
            const u = (t * 1.8 + i * 0.13) % 1;
            const u2 = (t * 1.8 + i * 0.13 + 0.5) % 1;
            const easeU = v => v * v * (3 - 2 * v);
            p1.setAttribute('cx', lerp(422, 1372, u).toFixed(1));
            p1.setAttribute('cy', lerp(560, y, easeU(u)).toFixed(1));
            p2.setAttribute('cx', lerp(422, 1372, u2).toFixed(1));
            p2.setAttribute('cy', lerp(560, y, easeU(u2)).toFixed(1));
            if (ch.hero && t >= ch.cue) {
              hdr.setAttribute('stroke', C.cream);
            }
          });
        }
      };
    });

    // =========================================================================
    // SCENE 5B (283.06 - 301.54s): Slip #37 Match -> Self-Emptying Cash & ETH Machine + 03:24 + cap_07
    // VO: "20 minutes past the hour, one of those 50 slips catches on Ethereum, turning a main Binance wallet into a self emptying machine. Three minutes and 24 seconds later, over 167,000 ether and $1.6 billion in tether disappear in a single sweep."
    // =========================================================================
    addScene(283.06, 301.54, { dark: true }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.night }, g);
      halftone(g, { color: C.yellow, step: 26, angle: 18, f: (x, y) => clamp(0.42 - Math.hypot(x - 520, y - 560) / 860) });
      for (let x = 180; x < 1920; x += 280) wLine(g, x, 0, x, 870, { stroke: C.night2, 'stroke-width': 3 }, x);
      el('rect', { x: 0, y: 870, width: 1920, height: 210, fill: C.night3, stroke: C.navy, 'stroke-width': 7 }, g);
      el('rect', { x: 0, y: 862, width: 1920, height: 14, fill: 'url(#patStripeDanger)' }, g);

      const title = chars(g, 'SELF-EMPTYING VAULT', {
        x: 84, y: 150, size: 76, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.mint },
      });

      // Top-Left: Spinning Ethereum Nonce Gear + SLIP #37 Locking In!
      const nonceGear = drawGear(g, 260, 390, 122, 14, C.blue, C.yellow);
      const slip37 = el('g', { filter: 'url(#boil)' }, g);
      el('rect', { x: -102, y: -44, width: 204, height: 88, rx: 10, fill: C.yellow, stroke: C.navy, 'stroke-width': 6 }, slip37);
      txt(slip37, 'SLIP #37', { x: 0, y: -4, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 32, fill: C.navy });
      txt(slip37, 'ETH NONCE MATCH!', { x: 0, y: 26, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 15, 'font-weight': 800, fill: C.red });

      // Top-Center: 8:20 PM Clock + Giant Racing LED Stopwatch (00:00 -> 03:24)
      wRect(g, 520, 215, 455, 165, { rx: 16, fill: C.night3, stroke: C.red, 'stroke-width': 6 }, 510);
      txt(g, '8:20 PM · DRAIN STOPWATCH', { x: 747, y: 256, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.yellow });
      const timerTxt = txt(g, '00:00', { x: 747, y: 344, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 92, fill: C.red });

      // Lower-Left/Center: Roaring Self-Emptying Cash & ETH Machine
      wRect(g, 115, 535, 860, 335, { rx: 18, fill: C.night2, stroke: C.cream, 'stroke-width': 6 }, 511);
      el('rect', { x: 145, y: 558, width: 800, height: 50, rx: 8, fill: C.night3, stroke: C.mint, 'stroke-width': 4 }, g);
      txt(g, 'BINANCE MAIN ETH HOT WALLET -> EMPTYING', { x: 545, y: 590, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.mint });
      // Cash & ETH particles placed BEFORE funnel so they emerge cleanly from below SPIGOT mouth!
      const drainBills = Array.from({ length: 14 }, (_, i) => ({ g: billNote(g), i }));
      const drainEths = Array.from({ length: 10 }, (_, i) => ({ g: ethDiamond(g, 0, 0, 1.15, i % 2 ? C.sky : C.yellow), i }));
      // Chute drawn cleanly on top of particle spawn point
      el('polygon', { points: '240,624 460,624 420,715 280,715', fill: C.yellow, ...S }, g);
      txt(g, 'SPIGOT', { x: 350, y: 678, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.navy });

      // Right Exhibit: cap_07_tx_drain_feed.png
      const cap7 = mountCapture(g, 'captures/cap_07_tx_drain_feed.png', {
        x: 1020, y: 200, w: 815, h: 525, tag: 'EXHIBIT G // ONE SWEEP', dark: true, tape: true,
      });
      wRect(g, 1020, 745, 815, 112, { rx: 14, fill: C.night3, stroke: C.yellow, 'stroke-width': 5 }, 512);
      txt(g, '167,000+ ETH  +  $1.6B USDT', { x: 1427, y: 805, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 44, fill: C.yellow });
      txt(g, 'GONE IN 3 MINUTES 24 SECONDS', { x: 1427, y: 840, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 18, 'font-weight': 800, fill: C.mint });

      const sweepStamp = makeStamp(g, 'ONE SWEEP', C.red, 390, 114, 52);

      return (t) => {
        charsPop(title, t, 283.20);
        const lockP = E.back(seg(t, 283.1, 283.7));
        nonceGear.setAttribute('transform', `translate(260 390) rotate(${(lockP < 1 ? (t - 283) * 160 : 128).toFixed(1)})`);
        tf(slip37, lerp(440, 260, lockP), lerp(215, 315, lockP), 1, lerp(-14, 0, lockP));

        // Racing stopwatch 00:00 -> 03:24 (total 204s scaled smoothly 287.5 -> 292.3s)
        const swP = seg(t, 287.5, 292.3);
        const secs = Math.round(swP * 204);
        const mm = String(Math.floor(secs / 60)).padStart(2, '0');
        const ss = String(secs % 60).padStart(2, '0');
        timerTxt.textContent = `${mm}:${ss}`;
        timerTxt.setAttribute('fill', swP >= 0.99 ? C.red : C.yellow);

        // Hurricane torrent emerging cleanly from bottom mouth of SPIGOT
        const pour = E.out(seg(t, 285.5, 286.6));
        drainBills.forEach(({ g: bg, i }) => {
          op(bg, pour);
          const cyc = ((t - 285.0) * 1.4 + i * 0.14) % 1;
          tf(bg, lerp(360, 910, cyc), 748 + Math.sin(cyc * 7 + i) * 46 + cyc * 45, 0.90, cyc * 85 - 40);
        });
        drainEths.forEach(({ g: eg, i }) => {
          op(eg, pour);
          const cyc = ((t - 285.0) * 1.55 + i * 0.17 + 0.3) % 1;
          tf(eg, lerp(355, 900, cyc), 758 + Math.cos(cyc * 6 + i) * 44 + cyc * 35, 1.1, cyc * 40);
        });

        op(cap7.g, E.out(seg(t, 288.0, 288.8)));
        stampAnim(sweepStamp, t, 297.50, 1430, 650, -8);
      };
    });

    // =========================================================================
    // SCENE 5C (301.54 - 317.18s): US-Audience Split-Screen ($5K Bank Manager vs $6.3B Empty Bay)
    // VO: "People watching online that night couldn't wrap their heads around it. If you try to pull $5,000 out of a regular bank, a manager calls your phone. Somehow $6.3 billion just walked out in 20 minutes without a single human stepping in front of the door."
    // =========================================================================
    addScene(301.54, 317.18, { dark: false }, (g) => {
