<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binance $6.3B Heist — Act 1 (Level-10 Halftone Dossier)</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4ECDD; }
  svg, canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #paper { mix-blend-mode: multiply; pointer-events: none; }
  #fx { pointer-events: none; }
  .mul { mix-blend-mode: multiply; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs></defs>
  <g clip-path="url(#frameClip)">
    <g id="cam"><g id="world"></g></g>
    <g id="hud"></g>
    <g id="wipe"></g>
    <rect id="flash" width="1920" height="1080" fill="#FFFFFF" opacity="0"/>
  </g>
</svg>
<canvas id="paper" width="1920" height="1080"></canvas>
<canvas id="fx" width="960" height="540"></canvas>

<script src="shared/engine.js"></script>
<script>
const E_ = window.Engine;
const { C, F, el, txt, tf, op, show, clamp, seg, lerp, smooth, E, wRect, wLine, chars, charsPop, halftone, makeStamp, stampAnim, billNote, personRig, mountCapture, clickRipple } = E_;

E_.createStage({
  actNum: 1,
  actTitle: 'THE $6.3B SILENT BREACH',
  actOffset: 0.0,
  frames: 1064, // 0.0000s -> 44.3333s exact 24fps
  assets: ['captures/cap_01_binance_app_withdraw.png'],
  wipes: [
    [1.50, C.yellow],
    [10.02, C.yellow],
    [15.30, C.night],
    [20.54, C.mint],
    [27.82, C.orange],
    [34.10, C.pink],
    [42.40, C.yellow],
  ],
  shakes: [
    [0.55, 16, 0.25],
    [13.20, 20, 0.30],
    [17.85, 10, 0.20],
    [18.60, 10, 0.20],
    [19.35, 12, 0.22],
    [26.10, 14, 0.24],
    [29.90, 16, 0.26],
    [31.40, 16, 0.26],
    [40.10, 16, 0.28],
  ],
  flashes: [
    [0.55, 0.32, 0.18],
    [13.20, 0.36, 0.22],
    [40.10, 0.30, 0.20],
  ],
  hudCues: [
    [0.00, 'OCT 29 · 8:05 PM'],
    [10.02, 'OCT 29 · 8:25 PM'],
    [20.54, 'AUDIT · LOGS'],
    [27.82, 'INTERNAL SIGNING'],
    [34.10, '5 MONTHS INSIDE'],
    [42.40, '◀◀ REWIND TO JUNE'],
  ],

  buildScenes(addScene) {
    const S = { stroke: C.navy, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

    // =========================================================================
    // SCENE 1A (0.00 - 1.50s): Cold Open Dossier Case Slam on Lamp-Lit Desk
    // =========================================================================
    addScene(0.00, 1.50, { dark: true }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.night3 }, g);
      // Warm mahogany desk grain + halftone spotlight from banker's lamp
      el('rect', { x: 80, y: 80, width: 1760, height: 920, rx: 18, fill: C.night, stroke: C.navy, 'stroke-width': 8 }, g);
      halftone(g, { color: C.yellow, step: 26, angle: 16, f: (x, y) => clamp(0.45 - Math.hypot(x - 960, y - 540) / 1000), opacity: 0.45 });
      // Decorative scattered desk props: red evidence folders, pen, brass clips
      el('rect', { x: 180, y: 170, width: 320, height: 420, rx: 10, fill: C.red, stroke: C.navy, 'stroke-width': 6, transform: 'rotate(-11 340 380)' }, g);
      el('rect', { x: 1410, y: 490, width: 320, height: 400, rx: 10, fill: C.blue, stroke: C.navy, 'stroke-width': 6, transform: 'rotate(12 1570 690)' }, g);

      // Center Manila Case Folder opening cleanly
      const folder = el('g', { filter: 'url(#boil)' }, g);
      tf(folder, 960, 560);
      wRect(folder, -480, -300, 960, 600, { rx: 16, fill: C.paper, ...S }, 101);
      wRect(folder, -480, -346, 300, 54, { rx: 10, fill: C.yellow, ...S }, 102);
      txt(folder, 'DOSSIER #2026-BNB', { x: -330, y: -312, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });
      el('rect', { x: -420, y: -230, width: 840, height: 470, rx: 10, fill: C.cream, stroke: C.navy, 'stroke-width': 5 }, folder);

      const title = chars(folder, 'THE $6.3B HEIST', {
        x: 0, y: -65, size: 78, family: F.serif, fill: C.navy, anchor: 'middle', shadow: { dx: 6, dy: 6, fill: C.yellow },
      });
      txt(folder, 'INVESTIGATION FILE · BINANCE WALLET BREACH', {
        x: 0, y: 15, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 25, 'font-weight': 800, fill: C.blue,
      });

      const stamp = makeStamp(g, 'OCT 29 · 8:05 PM', C.red, 540, 132, 46);
      return (t) => {
        const sc = 0.85 + 0.15 * E.back(seg(t, 0.0, 0.35));
        tf(folder, 960, 560, sc);
        charsPop(title, t, 0.12, 0.018);
        stampAnim(stamp, t, 0.52, 960, 710, -7);
      };
    });

    // =========================================================================
    // SCENE 1B (1.50 - 10.02s): Level-10 Vault Atrium + 10 Blockchain Pipes
    // VO: "At 8.05 pm on October 29th, money starts pouring out of Binance across 10 blockchains at once."
    // =========================================================================
    addScene(1.50, 10.02, {
      dark: true,
      camFn: (t) => {
        const k = 1 + 0.04 * smooth(seg(t, 1.5, 10.02));
        return `translate(960 540) scale(${k.toFixed(4)}) translate(-960 -540)`;
      }
    }, (g) => {
      const hall = E_.decorVaultHall(g, { groundY: 840 });

      // Live Ticker Ribbon placed cleanly between headline and CCTV camera
      wRect(g, 865, 88, 615, 48, { rx: 8, fill: C.navy, stroke: C.cream, 'stroke-width': 4 }, 110);
      txt(g, 'LIVE FLOW // CRITICAL HOT WALLET OUTFLOW', {
        x: 1172, y: 119, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.yellow,
      });

      const title = chars(g, '8:05 PM · OCT 29', {
        x: 84, y: 152, size: 82, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.pink },
      });

      // Architectural Binance Vault Pavilion on left (anchored cleanly below headline)
      wRect(g, 82, 818, 600, 32, { rx: 6, fill: C.slate, ...S }, 111);
      const bldg = el('g', {}, g);
      el('polygon', { points: '90,340 380,218 670,340', fill: C.yellow, ...S }, bldg);
      el('rect', { x: 110, y: 340, width: 540, height: 480, fill: C.blue, ...S }, bldg);
      for (const cx of [142, 576]) el('rect', { x: cx, y: 340, width: 44, height: 480, fill: C.cream, ...S }, bldg);
      txt(bldg, 'BINANCE VAULT', { x: 380, y: 315, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 28, 'font-weight': 800, fill: C.navy });

      // Circular Vault Aperture + Animated Hinged Gold Door
      el('circle', { cx: 380, cy: 590, r: 148, fill: C.night3, stroke: C.cream, 'stroke-width': 10 }, bldg);
      const door = el('g', {}, bldg);
      el('circle', { cx: 230, cy: 590, r: 112, fill: C.yellow, stroke: C.navy, 'stroke-width': 8 }, door);
      el('circle', { cx: 230, cy: 590, r: 34, fill: C.navy }, door);

      // Right Architectural Manifold Tower holding the 10 blockchain gauges
      wRect(g, 1595, 165, 250, 695, { rx: 14, fill: C.night2, stroke: C.cream, 'stroke-width': 6 }, 112);

      // 20 spinning cash bills flying out of open vault
      const bills = Array.from({ length: 20 }, (_, i) => ({ g: billNote(g), i }));

      // 10 Labeled Blockchain Pipes + animated flow pulses
      const CHAINS = ['ETH', 'BTC', 'SOL', 'XRP', 'TRX', 'BNB', 'ADA', 'AVAX', 'DOGE', 'LINK'];
      const pipes = CHAINS.map((name, i) => {
        const pg = el('g', {}, g);
        const y = 205 + i * 66;
        const col = i % 2 === 0 ? C.yellow : C.pink;
        const pathD = `M 526 590 C 920 590 1120 ${y} 1622 ${y}`;
        el('path', { d: pathD, fill: 'none', stroke: C.navy, 'stroke-width': 24, 'stroke-linecap': 'round' }, pg);
        el('path', { d: pathD, fill: 'none', stroke: col, 'stroke-width': 12, 'stroke-linecap': 'round' }, pg);
        const pulse = el('circle', { cx: 526, cy: 590, r: 10, fill: C.mint, stroke: C.navy, 'stroke-width': 4 }, pg);
        const pulse2 = el('circle', { cx: 526, cy: 590, r: 8, fill: C.cream, stroke: C.navy, 'stroke-width': 3 }, pg);
        // Wall valve flange + chain label chip
        el('rect', { x: 1622, y: y - 24, width: 194, height: 48, rx: 10, fill: col, stroke: C.navy, 'stroke-width': 5 }, pg);
        txt(pg, name, { x: 1719, y: y + 9, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 25, 'font-weight': 800, fill: C.navy });
        return { pg, pulse, pulse2, y, i };
      });

      const subChip = el('g', {}, g);
      wRect(subChip, 92, 910, 480, 56, { rx: 10, fill: C.red, stroke: C.cream, 'stroke-width': 4 }, 113);
      txt(subChip, '10 BLOCKCHAINS SIMULTANEOUSLY', {
        x: 332, y: 946, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream,
      });

      return (t) => {
        charsPop(title, t, 1.65);
        op(hall.camLed, (Math.floor(t * 3) % 2) ? 1 : 0.25);
        hall.camG.setAttribute('transform', `rotate(${(Math.sin(t * 1.1) * 4).toFixed(1)} 1630 110)`);

        const doorOpen = E.out(seg(t, 1.7, 2.8));
        tf(door, lerp(150, 0, doorOpen), 0, 1);

        bills.forEach(({ g: bg, i }) => {
          const active = seg(t, 2.2, 3.0);
          op(bg, active);
          const cyc = ((t * 1.45 + i * 0.14) % 1.4) / 1.4;
          const x = lerp(385, 1585, cyc);
          const y = 590 + Math.sin(cyc * Math.PI * 2 + i) * 165 + (i - 10) * 16 * cyc;
          tf(bg, x, y, 0.88, cyc * 65 - 32);
        });

        pipes.forEach(({ pg, pulse, pulse2, y, i }) => {
          op(pg, seg(t, 6.7 + i * 0.13, 7.1 + i * 0.13));
          const u = (t * 1.65 + i * 0.11) % 1;
          const u2 = (t * 1.65 + i * 0.11 + 0.5) % 1;
          const easeU = v => v * v * (3 - 2 * v);
          pulse.setAttribute('cx', lerp(526, 1618, u).toFixed(1));
          pulse.setAttribute('cy', lerp(590, y, easeU(u)).toFixed(1));
          pulse2.setAttribute('cx', lerp(526, 1618, u2).toFixed(1));
          pulse2.setAttribute('cy', lerp(590, y, easeU(u2)).toFixed(1));
        });

        op(subChip, E.out(seg(t, 7.2, 7.7)));
      };
    });

    // =========================================================================
    // SCENE 1C (10.02 - 15.30s): Level-10 Empty Vault + 20-Min Spin + -$6.3B Slam
    // VO: "20 minutes later, $6.3 billion is gone."
    // =========================================================================
    addScene(10.02, 15.30, { dark: false }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.paper }, g);
      halftone(g, { color: C.yellow, step: 24, angle: 20, f: (x, y) => clamp(0.45 - Math.hypot(x - 1320, y - 560) / 880) });
      // Bunker stone wall panel grid & baseboard
      for (let x = 0; x < 1920; x += 240) wLine(g, x, 0, x, 865, { stroke: C.navy, 'stroke-width': 3, opacity: 0.18 }, x);
      el('rect', { x: 0, y: 865, width: 1920, height: 215, fill: C.night2, stroke: C.navy, 'stroke-width': 7 }, g);

      // Left: Architectural Riveted Vault Interior Room (with empty racks, balance meter & cobweb)
      wRect(g, 92, 140, 680, 725, { rx: 14, fill: C.night, ...S }, 120);
      el('rect', { x: 112, y: 160, width: 640, height: 48, rx: 6, fill: C.night3, stroke: C.navy, 'stroke-width': 4 }, g);
      txt(g, 'VAULT STORAGE CHAMBER #01', { x: 432, y: 191, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.cream });

      for (const sy of [330, 490, 650]) {
        el('rect', { x: 135, y: sy, width: 594, height: 20, rx: 4, fill: C.night2, stroke: C.cream, 'stroke-width': 4 }, g);
        el('line', { x1: 185, y1: sy + 20, x2: 185, y2: sy + 95, stroke: C.slate, 'stroke-width': 8 }, g);
        el('line', { x1: 679, y1: sy + 20, x2: 679, y2: sy + 95, stroke: C.slate, 'stroke-width': 8 }, g);
      }
      // Cobweb + swinging spider
      el('path', { d: 'M 112 208 L 270 285 M 112 208 L 210 345 M 164 234 Q 170 278 142 296 M 214 256 Q 220 310 176 326', fill: 'none', stroke: C.cream, 'stroke-width': 4 }, g);
      const spider = el('g', { filter: 'url(#boil)' }, g);
      el('line', { x1: 232, y1: 268, x2: 232, y2: 332, stroke: C.cream, 'stroke-width': 3 }, spider);
      el('circle', { cx: 232, cy: 340, r: 10, fill: C.cream }, spider);

      // Vault balance gauge bar plummeting to ZERO
      el('rect', { x: 145, y: 745, width: 574, height: 74, rx: 10, fill: C.night3, stroke: C.cream, 'stroke-width': 4 }, g);
      const meterBar = el('rect', { x: 155, y: 755, width: 554, height: 54, rx: 6, fill: C.mint }, g);
      const meterLbl = txt(g, 'BALANCE: $6.30B', { x: 432, y: 792, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 26, 'font-weight': 800, fill: C.cream });

      // Top-right: 12-Tick Brass Wall Clock
      const clk = el('g', { filter: 'url(#boil)' }, g);
      tf(clk, 1300, 260);
      el('circle', { cx: 0, cy: 0, r: 118, fill: C.cream, stroke: C.navy, 'stroke-width': 9 }, clk);
      el('circle', { cx: 0, cy: 0, r: 102, fill: 'none', stroke: C.navy, 'stroke-width': 3, opacity: 0.35 }, clk);
      for (let h = 0; h < 12; h++) {
        const a = (h / 12) * Math.PI * 2;
        el('line', { x1: Math.cos(a) * 86, y1: Math.sin(a) * 86, x2: Math.cos(a) * 102, y2: Math.sin(a) * 102, stroke: C.navy, 'stroke-width': 5 }, clk);
      }
      el('line', { x1: 0, y1: 0, x2: -45, y2: -24, stroke: C.navy, 'stroke-width': 10, 'stroke-linecap': 'round' }, clk);
      const minH = el('line', { x1: 0, y1: 0, x2: 0, y2: -78, stroke: C.red, 'stroke-width': 8, 'stroke-linecap': 'round' }, clk);
      el('circle', { cx: 0, cy: 0, r: 10, fill: C.navy }, clk);
      el('rect', { x: -135, y: 132, width: 270, height: 48, rx: 10, fill: C.yellow, stroke: C.navy, 'stroke-width': 5 }, clk);
      txt(clk, '20 MIN LATER', { x: 0, y: 164, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 26, 'font-weight': 800, fill: C.navy });

      // Massive headline -$6.3B
      const bigLoss = chars(g, '-$6.3B', {
        x: 1300, y: 690, size: 225, family: F.serif, fill: C.red, anchor: 'middle', shadow: { dx: 12, dy: 12, fill: C.navy },
      });
      const stamp = makeStamp(g, 'GONE', C.red, 370, 128, 60);

      return (t) => {
        const spin = smooth(seg(t, 10.2, 12.1));
        minH.setAttribute('transform', `rotate(${lerp(24, 150, spin).toFixed(1)})`);
        spider.setAttribute('transform', `rotate(${(Math.sin(t * 2.5) * 3.5).toFixed(1)} 232 268)`);

        const drain = E.out(seg(t, 10.3, 12.2));
        meterBar.setAttribute('width', Math.max(4, (1 - drain) * 554).toFixed(1));
        meterLbl.textContent = drain > 0.85 ? 'VAULT BALANCE: $0.00' : `DRAINING: $${((1 - drain) * 6.3).toFixed(2)}B`;

        charsPop(bigLoss, t, 11.4, 0.045, 0.32, 70);
        stampAnim(stamp, t, 13.20, 1520, 770, -11);
      };
    });

    // =========================================================================
    // SCENE 1D (15.30 - 20.54s): Level-10 Bedroom + Stylized Binance App Exhibit
    // VO: "Users open the app to pull their cash out and the withdraw button is grayed out."
    // =========================================================================
    addScene(15.30, 20.54, {
      dark: true,
      camFn: (t) => {
        const k = 1 + 0.045 * smooth(seg(t, 15.3, 20.54));
        return `translate(960 540) scale(${k.toFixed(4)}) translate(-960 -540)`;
      }
    }, (g) => {
      E_.decorBedroomNight(g, { clockText: '8:25 PM' });
      const title = chars(g, 'WITHDRAW: LOCKED', {
        x: 84, y: 148, size: 78, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.blue },
      });

      // Left-center: Articulated User in bed holding illuminated phone
      const user = personRig(g, { shirt: C.pink, hair: C.navy, hairStyle: 'crop', mode: 'bed', expression: 'shocked' });
      tf(user.g, 585, 650, 1.0);
      // Mini glow cone rising from user's handheld phone onto panicked face
      const userPhone = el('g', {}, g);
      el('polygon', { points: '555,830 615,830 680,550 490,550', fill: 'url(#patDotsBlue)', opacity: 0.55 }, userPhone);
      el('rect', { x: 552, y: 815, width: 66, height: 92, rx: 10, fill: C.cream, stroke: C.navy, 'stroke-width': 6 }, userPhone);

      // Right Exhibit Card: Mounted cap_01_binance_app_withdraw.png
      const cap = mountCapture(g, 'captures/cap_01_binance_app_withdraw.png', {
        x: 1235, y: 145, w: 465, h: 770, tag: 'EXHIBIT A // APP UI', dark: true, tape: true,
      });

      // Articulated Cartoon Pointing Hand + Wrist aiming at corner of WITHDRAW button (never obscuring text!)
      const tapHand = el('g', { filter: 'url(#boil)' }, g);
      el('path', { d: 'M 42 52 L 155 155 L 105 205 L 4 95 Z', fill: C.pink, stroke: C.navy, 'stroke-width': 7 }, tapHand);
      el('path', { d: 'M -8 -6 C -16 -22 6 -34 18 -14 L 56 32 C 74 44 82 68 58 84 L 22 92 C 0 88 -12 68 -8 46 L -32 8 C -40 -6 -22 -18 -8 -6 Z', fill: C.skin, stroke: C.navy, 'stroke-width': 7 }, tapHand);

      const rp1 = clickRipple(g, 1590, 825, C.red);
      const rp2 = clickRipple(g, 1590, 825, C.yellow);
      const rp3 = clickRipple(g, 1590, 825, C.red);
      const statusStamp = makeStamp(g, 'GRAYED OUT', C.red, 440, 118, 44);

      return (t) => {
        charsPop(title, t, 15.45);
        user.setState({ lookX: 3, lookY: 6, blink: t > 16.5 && t < 16.65, headDy: Math.sin(t * 7) * 3 });
        op(cap.g, E.out(seg(t, 15.6, 16.2)));
        const tap1 = seg(t, 17.6, 17.9) * (1 - seg(t, 17.9, 18.2));
        const tap2 = seg(t, 18.35, 18.65) * (1 - seg(t, 18.65, 18.95));
        const tap3 = seg(t, 19.1, 19.4) * (1 - seg(t, 19.4, 19.8));
        const tx = lerp(1820, 1612, E.out(seg(t, 17.0, 17.5)));
        const ty = 835 - (tap1 + tap2 + tap3) * 18;
        tf(tapHand, tx, ty, E.out(seg(t, 17.0, 17.4)), -8 + (tap1 + tap2 + tap3) * 12);
        rp1(t, 17.85); rp2(t, 18.60); rp3(t, 19.35);
        stampAnim(statusStamp, t, 18.9, 1470, 560, -8);
      };
    });

    // =========================================================================
    // SCENE 1E (20.54 - 27.82s): Level-10 Forensic Audit Office + Glass Bell Jar Key
    // VO: "When Binance pulls the logs, nothing adds up. No blockchain got broken, not a single private key was leaked."
    // =========================================================================
    addScene(20.54, 27.82, { dark: false }, (g) => {
      const office = E_.decorOfficeRoom(g, {
        wall: C.paper, deskY: 730, timeLabel: 'AUDIT LAB', hasWindow: true, hasBookshelf: true, hasCorkboard: true,
      });

      const title = chars(g, 'CLEAN LOGS?!', {
        x: 84, y: 146, size: 76, family: F.serif, fill: C.navy, shadow: { dx: 7, dy: 7, fill: C.mint },
      });

      // Desk Monitor + Audit Paper Log Stack
      wRect(g, 745, 225, 430, 520, { rx: 8, fill: C.cream, ...S }, 130);
      el('rect', { x: 765, y: 245, width: 390, height: 52, rx: 6, fill: C.navy }, g);
      txt(g, 'SYSTEM AUDIT LOGS', { x: 960, y: 279, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream });
      txt(g, 'CHAIN STATE: INTACT', { x: 960, y: 332, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.blue });

      const logRows = [];
      for (let i = 0; i < 6; i++) {
        const tEl = txt(g, `BLOCK #9${i} ..... [OK]`, {
          x: 805, y: 392 + i * 56, 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.teal,
        });
        logRows.push(tEl);
      }

      // Articulated Confused Analyst sitting behind desk sweeping magnifying glass
      const analyst = personRig(g, {
        shirt: C.blue, hair: C.orange, hairStyle: 'crop', glasses: true, mode: 'analyst', expression: 'confused',
      });
      tf(analyst.g, 395, 580, 1.0);
      // Magnifying glass attached on desk layer sweeping cleanly over log sheet
      const loupe = el('g', { filter: 'url(#boil)' }, g);
      el('line', { x1: 0, y1: 0, x2: 72, y2: -64, stroke: C.navy, 'stroke-width': 13, 'stroke-linecap': 'round' }, loupe);
      el('circle', { cx: 108, cy: -98, r: 62, fill: 'rgba(130, 220, 255, 0.34)', stroke: C.navy, 'stroke-width': 10 }, loupe);

      // Right Desk Pedestal: Untouched Private Key inside Glass Bell Jar
      const keyPod = el('g', {}, g);
      halftone(keyPod, { x0: 1200, y0: 250, w: 460, h: 480, color: C.mint, step: 22, angle: 28, f: (x, y) => clamp(0.60 - Math.hypot(x - 1430, y - 520) / 260) });
      wRect(keyPod, 1275, 682, 310, 48, { rx: 8, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, 131);
      txt(keyPod, 'PRIVATE KEYS', { x: 1430, y: 713, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.yellow });
      el('path', { d: 'M 1310 682 L 1310 475 A 120 120 0 0 1 1550 475 L 1550 682 Z', fill: 'rgba(255, 244, 226, 0.50)', stroke: C.navy, 'stroke-width': 7 }, keyPod);
      const goldKey = el('g', { filter: 'url(#boil)' }, keyPod);
      el('circle', { cx: 1430, cy: 480, r: 34, fill: C.yellow, ...S }, goldKey);
      el('rect', { x: 1419, y: 514, width: 22, height: 112, fill: C.yellow, ...S }, goldKey);
      el('rect', { x: 1441, y: 576, width: 32, height: 18, fill: C.yellow, ...S }, goldKey);
      el('rect', { x: 1441, y: 604, width: 22, height: 16, fill: C.yellow, ...S }, goldKey);

      const stamp = makeStamp(g, '0 LEAKS', C.blue, 360, 118, 50);

      return (t) => {
        office.updateOffice(t);
        charsPop(title, t, 20.7);
        const sweep = Math.sin(t * 2.1);
        analyst.setState({ lookX: 4, lookY: sweep * 4, headRot: sweep * 2.5, blink: t > 22.8 && t < 22.95 });
        tf(loupe, 645, 650 + sweep * 58, 1, sweep * 5);

        const baseBlk = 90 + Math.floor((t - 20.54) * 1.4);
        logRows.forEach((lr, idx) => { lr.textContent = `BLOCK #${baseBlk + idx} .... [OK]`; });

        op(keyPod, E.back(seg(t, 23.4, 24.1)));
        stampAnim(stamp, t, 26.10, 1430, 325, -8);
      };
    });

    // =========================================================================
    // SCENE 1F (27.82 - 34.10s): Automated Signing Factory + Clerk & Stamp Arm
    // VO: "Every transfer that drained those wallets was legitimately signed by Binance's own internal system."
    // =========================================================================
    addScene(27.82, 34.10, { dark: false }, (g) => {
      const factory = E_.decorFactoryFloor(g);
      const title = chars(g, 'LEGITIMATE SIGNS', {
        x: 84, y: 156, size: 78, family: F.serif, fill: C.navy, shadow: { dx: 7, dy: 7, fill: C.yellow },
      });

      // Clerk standing behind assembly bench on left
      const clerk = personRig(g, {
        shirt: C.cream, hair: C.navy, hairStyle: 'crop', tie: C.red, badge: true, mode: 'desk', expression: 'smile',
      });
      tf(clerk.g, 330, 560, 0.96);

      // Sliding Outbound Transfer Manifest Sheets along conveyor
      const sheets = Array.from({ length: 4 }, (_, i) => {
        const sg = el('g', {}, g);
        el('rect', { x: -135, y: -195, width: 270, height: 190, rx: 8, fill: C.cream, ...S }, sg);
        el('rect', { x: -115, y: -175, width: 230, height: 32, rx: 4, fill: C.night2 }, sg);
        txt(sg, `TX #884${i + 1} · -$180M`, { x: 0, y: -153, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 16, 'font-weight': 800, fill: C.yellow });
        el('line', { x1: -105, y1: -118, x2: 95, y2: -118, stroke: C.slate, 'stroke-width': 6 }, sg);
        el('line', { x1: -105, y1: -92, x2: 55, y2: -92, stroke: C.slate, 'stroke-width': 6 }, sg);
        const st = makeStamp(sg, 'APPROVED', C.red, 215, 72, 32);
        return { sg, st, i };
      });

      // Overhead Hydraulic Mechanical Stamp Arm at x=960
      el('rect', { x: 928, y: 205, width: 64, height: 140, fill: C.slate, ...S }, g);
      const arm = el('g', { filter: 'url(#boil)' }, g);
      el('rect', { x: 942, y: 315, width: 36, height: 185, fill: C.wood, ...S }, arm);
      el('rect', { x: 865, y: 492, width: 190, height: 54, rx: 10, fill: C.red, ...S }, arm);
      txt(arm, 'AUTO-SIGN', { x: 960, y: 527, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream });

      // Right Verification Signet Badge: SIGNED BY BINANCE
      const sealG = el('g', { filter: 'url(#boil)' }, g);
      wRect(sealG, 1410, 215, 430, 210, { rx: 16, fill: C.navy, stroke: C.yellow, 'stroke-width': 7 }, 140);
      txt(sealG, 'INTERNAL SIGNATURE', { x: 1625, y: 268, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.mint });
      txt(sealG, '100% VALID', { x: 1625, y: 342, 'text-anchor': 'middle', 'font-family': F.serif, 'font-size': 52, 'font-weight': 900, fill: C.yellow });
      txt(sealG, 'BINANCE OWN SYSTEM', { x: 1625, y: 392, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.cream });

      return (t) => {
        factory.updateFactory(t);
        charsPop(title, t, 28.0);
        // 2 rhythmic mechanical stamp strikes at 29.90 and 31.40
        const s1 = Math.exp(-Math.pow((t - 29.90) / 0.16, 2));
        const s2 = Math.exp(-Math.pow((t - 31.40) / 0.16, 2));
        const dy = (s1 + s2) * 115;
        tf(arm, 0, dy);
        clerk.setState({ lookX: 8, rArm: [102, 145, 220, 120, 310, 175] });

        sheets.forEach(({ sg, st, i }) => {
          const sx = 540 + ((t - 27.82) * 240 + i * 330) % 1280;
          tf(sg, sx, 742);
          if (sx > 945) { op(st, 0.94); tf(st, 0, -56, 1, -8); }
          else { op(st, 0); }
        });
        op(sealG, E.back(seg(t, 30.8, 31.4)));
      };
    });

    // =========================================================================
    // SCENE 1G (34.10 - 44.33s): 2-Floor Cutaway (5 Months) -> Fortress Gate -> Rewind
    // VO: "Whoever pulled this off had been inside the company for five months. And the way they got in had nothing to do with breaking code. Rewind to June."
    // =========================================================================
    addScene(34.10, 44.3334, { dark: true }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.night }, g);
      halftone(g, { color: C.pink, step: 26, angle: 28, f: (x, y) => clamp(0.42 - Math.hypot(x - 1220, y - 540) / 860) });

      const title = chars(g, '5 MONTHS INSIDE', {
        x: 84, y: 148, size: 78, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.pink },
      });

      // LEFT: Rich Full-Height 2-Floor Architectural Cutaway Building
      const hq = el('g', {}, g);
      wRect(hq, 88, 170, 1140, 825, { rx: 14, fill: C.night3, stroke: C.cream, 'stroke-width': 7 }, 150);
      // Horizontal floor slab + concrete rivets
      el('rect', { x: 88, y: 560, width: 1140, height: 28, fill: C.slate, stroke: C.cream, 'stroke-width': 4 }, hq);
      // UPSTAIRS: Night Office with Bookshelf, Desk Lamp & Glowing-Eyed Intruder Silhouette!
      wRect(hq, 130, 215, 195, 345, { rx: 6, fill: C.woodDk, ...S }, 151);
      for (const by of [290, 385, 480]) el('line', { x1: 142, y1: by, x2: 312, y2: by, stroke: C.cream, 'stroke-width': 4 }, hq);
      // Glowing Wire Conduit passing straight down through concrete floor slab
      el('path', { d: 'M 555 440 L 555 710 L 895 710', fill: 'none', stroke: C.pink, 'stroke-width': 7, 'stroke-dasharray': '14 10' }, hq);
      // Office desk & hooded silhouette
      wRect(hq, 430, 435, 320, 125, { rx: 8, fill: C.wood, ...S }, 152);
      wRect(hq, 465, 348, 115, 86, { rx: 6, fill: C.cream, ...S }, 153);
      el('line', { x1: 482, y1: 378, x2: 560, y2: 378, stroke: C.blue, 'stroke-width': 6 }, hq);
      el('line', { x1: 482, y1: 400, x2: 540, y2: 400, stroke: C.red, 'stroke-width': 6 }, hq);
      const intruder = el('g', { filter: 'url(#boil)' }, hq);
      el('path', { d: 'M 810 490 C 810 310 950 310 950 490 Z', fill: '#0A0D1A', stroke: C.cream, 'stroke-width': 5 }, intruder);
      el('circle', { cx: 855, cy: 400, r: 9, fill: C.pink }, intruder);
      el('circle', { cx: 895, cy: 400, r: 9, fill: C.pink }, intruder);
      el('line', { x1: 825, y1: 448, x2: 695, y2: 432, stroke: C.cream, 'stroke-width': 12, 'stroke-linecap': 'round' }, intruder);

      // DOWNSTAIRS: Iron Vault Gate + 3 Blinking Server Racks
      wRect(hq, 140, 630, 260, 340, { rx: 8, fill: C.night2, stroke: C.yellow, 'stroke-width': 6 }, 154);
      for (const bx of [190, 242, 294, 346]) el('line', { x1: bx, y1: 632, x2: bx, y2: 968, stroke: C.yellow, 'stroke-width': 6 }, hq);
      el('rect', { x: 242, y: 765, width: 58, height: 68, rx: 8, fill: C.yellow, ...S }, hq);

      const rackLeds = [];
      for (const rx of [490, 740, 990]) {
        wRect(hq, rx, 628, 200, 342, { rx: 8, fill: C.night2, stroke: C.cream, 'stroke-width': 5 }, rx);
        for (let r = 0; r < 5; r++) {
          el('rect', { x: rx + 18, y: 650 + r * 62, width: 164, height: 42, rx: 4, fill: C.night3 }, hq);
          for (let l = 0; l < 3; l++) {
            const ld = el('circle', { cx: rx + 36 + l * 22, cy: 671 + r * 62, r: 5.5, fill: [C.mint, C.yellow, C.pink][l] }, hq);
            rackLeds.push({ ld, ph: rx * 0.01 + r + l });
          }
        }
      }

      // RIGHT SUB-PANEL 1 (34.10 - 38.80s): Flipping Desk Calendar (OCT -> JUN)
      const calG = el('g', { filter: 'url(#boil)' }, g);
      tf(calG, 1560, 560);
      wRect(calG, -220, -245, 440, 490, { rx: 20, fill: C.cream, ...S }, 160);
      wRect(calG, -220, -245, 440, 120, { rx: 20, fill: C.red, ...S }, 161);
      for (const rx of [-125, 125]) el('rect', { x: rx - 14, y: -275, width: 28, height: 55, rx: 8, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, calG);
      txt(calG, 'CALENDAR · 2026', { x: 0, y: -175, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream });
      const calMonth = txt(calG, 'OCT', { x: 0, y: 80, 'text-anchor': 'middle', 'font-family': F.serif, 'font-size': 155, 'font-weight': 900, fill: C.navy });
      txt(calG, '◀◀ 5 MONTHS BACK', { x: 0, y: 195, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.red });

      // RIGHT SUB-PANEL 2 (38.80 - 42.40s): Untouched Iron Door + Keycard Under Threshold
      const gateG = el('g', {}, g);
      wRect(gateG, 1300, 215, 535, 760, { rx: 14, fill: C.night2, stroke: C.cream, 'stroke-width': 6 }, 165);
      txt(gateG, 'NO EXPLOIT USED', { x: 1568, y: 278, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 26, 'font-weight': 800, fill: C.mint });
      wRect(gateG, 1410, 315, 316, 460, { rx: 8, fill: C.paper, stroke: C.navy, 'stroke-width': 7 }, 166);
      el('circle', { cx: 1568, cy: 495, r: 58, fill: C.yellow, ...S }, gateG);
      txt(gateG, 'LOCK OK', { x: 1568, y: 504, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });
      // Bottom gap where gold keycard slips silently underneath
      el('rect', { x: 1380, y: 765, width: 376, height: 18, fill: '#0A0D1A' }, gateG);
      const card = el('g', { filter: 'url(#boil)' }, gateG);
      el('rect', { x: 1500, y: 785, width: 136, height: 74, rx: 8, fill: C.yellow, ...S }, card);
      txt(card, 'KEYCARD', { x: 1568, y: 828, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.navy });
      const noCodeStamp = makeStamp(gateG, 'NO CODE BROKEN', C.red, 440, 114, 38);

      // FULLSCREEN SUB-BEAT 3 (42.40 - 44.33s): REWIND TO JUNE Vintage Cassette + Spools
      const rewG = el('g', {}, g);
      el('rect', { width: 1920, height: 1080, fill: C.yellow }, rewG);
      halftone(rewG, { color: C.orange, step: 26, angle: 18, f: (x, y) => clamp(0.65 - Math.hypot(x - 960, y - 540) / 960) });
      // Cassette body connecting dual tape reels
      wRect(rewG, 490, 165, 940, 290, { rx: 24, fill: C.navy, stroke: C.navy, 'stroke-width': 8 }, 170);
      el('rect', { x: 525, y: 195, width: 870, height: 230, rx: 14, fill: C.paper, stroke: C.navy, 'stroke-width': 5 }, rewG);
      el('rect', { x: 755, y: 260, width: 410, height: 95, rx: 8, fill: C.night, stroke: C.navy, 'stroke-width': 4 }, rewG);
      const reels = [-290, 290].map(rx => {
        const rg = el('g', {}, rewG);
        el('circle', { cx: 960 + rx, cy: 308, r: 88, fill: C.cream, ...S }, rg);
        el('circle', { cx: 960 + rx, cy: 308, r: 28, fill: C.navy }, rg);
        el('line', { x1: 960 + rx - 70, y1: 308, x2: 960 + rx + 70, y2: 308, stroke: C.navy, 'stroke-width': 7 }, rg);
        el('line', { x1: 960 + rx, y1: 308 - 70, x2: 960 + rx, y2: 308 + 70, stroke: C.navy, 'stroke-width': 7 }, rg);
        return { rg, cx: 960 + rx };
      });
      chars(rewG, '◀◀ REWIND TO JUNE', {
        x: 960, y: 655, size: 128, family: F.serif, fill: C.navy, anchor: 'middle', shadow: { dx: 10, dy: 10, fill: C.pink },
      });
      txt(rewG, 'FIVE MONTHS EARLIER · JUNE 2026', {
        x: 960, y: 745, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 32, 'font-weight': 800, fill: C.navy,
      });

      const months = ['OCT', 'SEP', 'AUG', 'JUL', 'JUN'];
      return (t) => {
        charsPop(title, t, 34.25);
        rackLeds.forEach(({ ld, ph }) => op(ld, Math.sin(t * 7 + ph) > 0 ? 1 : 0.25));

        const showCal = t < 38.80;
        const showGate = t >= 38.80 && t < 42.40;
        const showRew = t >= 42.40;
        show(calG, showCal);
        show(gateG, showGate);
        show(rewG, showRew);

        const mIdx = clamp(Math.floor((t - 34.4) / 0.8), 0, 4);
        calMonth.textContent = months[mIdx];

        if (showGate) {
          const slide = E.out(seg(t, 38.9, 39.8));
          tf(card, 0, lerp(110, 0, slide));
          stampAnim(noCodeStamp, t, 40.10, 1568, 635, -7);
        }
        if (showRew) {
          const spinDeg = -((t - 42.40) * 540);
          reels.forEach(({ rg, cx }) => rg.setAttribute('transform', `rotate(${spinDeg.toFixed(1)} ${cx} 308)`));
        }
      };
    });
  }
});
</script>
