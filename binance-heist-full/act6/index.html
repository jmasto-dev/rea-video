<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binance $6.3B Heist — Act 6 (Level-10 Halftone Dossier)</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4ECDD; }
  svg, canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #paper { mix-blend-mode: multiply; pointer-events: none; }
  #fx { pointer-events: none; }
  .mul { mix-blend-mode: multiply; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs></defs>
  <g clip-path="url(#frameClip)">
    <g id="cam"><g id="world"></g></g>
    <g id="hud"></g>
    <g id="wipe"></g>
    <rect id="flash" width="1920" height="1080" fill="#FFFFFF" opacity="0"/>
    <rect id="fade" width="1920" height="1080" fill="#1D2340" opacity="0"/>
  </g>
</svg>
<canvas id="paper" width="1920" height="1080"></canvas>
<canvas id="fx" width="960" height="540"></canvas>

<script src="shared/engine.js"></script>
<script>
const E_ = window.Engine;
const {
  C, F, el, txt, tf, op, show, clamp, seg, lerp, smooth, E,
  wRect, wLine, chars, charsPop, halftone, makeStamp, stampAnim,
  billNote, personRig, mountCapture, clickRipple,
} = E_;

E_.createStage({
  actNum: 6,
  actTitle: 'THE BAILOUT, THE ELEPHANT & THE 57 ATTEMPTS',
  actOffset: 9072 / 24, // 378.0000s exact 24fps
  frames: 2532,         // 378.0000s -> 483.5000s
  assets: [
    'captures/cap_09_doj_fbi_seizure.png',
    'captures/cap_10_binance_report_redacted.png',
  ],
  wipes: [
    [386.50, C.yellow],
    [394.82, C.wood],
    [403.20, C.night],
    [411.22, C.mint],
    [425.74, C.paper],
    [452.38, C.yellow],
    [460.10, C.night],
    [478.30, C.cream],
  ],
  shakes: [
    [391.60, 18, 0.28], // HOLE PLUGGED crater seal slam
    [397.40, 18, 0.28], // Judge gavel SLAM + SEIZED: $1.2B
    [417.65, 16, 0.25], // CLOSED stamp cracks ("Not quite.")
    [420.10, 14, 0.22], // Elephant boardroom reveal
    [432.50, 12, 0.20], // UNPUBLISHED stamp
    [438.80, 14, 0.22], // Redaction bar 1
    [444.50, 14, 0.22], // Redaction bar 2
    [448.80, 14, 0.22], // Redaction bar 3
    [461.50,  9, 0.14], // Shield deflection 1
    [463.60,  9, 0.14], // Shield deflection 2
    [465.80,  9, 0.14], // Shield deflection 3
    [468.10,  9, 0.14], // Shield deflection 4
    [470.40, 10, 0.16], // Shield deflection 5
    [479.30, 16, 0.25], // CASE STATUS: OPEN final stamp
  ],
  flashes: [
    [391.60, 0.30, 0.18],
    [397.40, 0.32, 0.18],
    [417.65, 0.26, 0.16],
    [479.30, 0.28, 0.16],
  ],
  hudCues: [
    [378.00, 'OCT 31 · WITHDRAWALS LIVE'],
    [386.50, 'NOV 12 · BAILOUT'],
    [394.82, 'DOJ · $1.2B SEIZED'],
    [403.20, 'DPRK · TRADER TRAITOR'],
    [411.22, 'CASE CLOSED?'],
    [417.60, 'THE ELEPHANT'],
    [425.74, 'OCT 30 · UNANSWERED'],
    [452.38, '57 ATTEMPTS · 2026'],
    [473.60, '1 FILE · 70 BYTES'],
    [478.30, 'CASE STATUS: OPEN'],
  ],

  buildScenes(addScene) {
    const S = { stroke: C.navy, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

    // =========================================================================
    // SCENE 6A-1 (378.00 - 386.50s): Morning Kitchen Desk — Withdrawals Restored ($4.6B)
    // VO: "Two days later, Binance turned withdrawals back on, processed $4.6 billion of customer cash outs in a single day."
    // =========================================================================
    addScene(378.00, 386.50, {
      dark: false,
      camFn: (t) => {
        const k = 1 + 0.035 * smooth(seg(t, 378.0, 386.5));
        return `translate(960 540) scale(${k.toFixed(4)}) translate(-960 -540)`;
      },
    }, (g) => {
      const office = E_.decorOfficeRoom(g, {
        dark: false, wall: C.paper, deskY: 745, timeLabel: '2 DAYS LATER',
        hasWindow: true, hasBookshelf: false, hasCorkboard: false, hasLamp: true,
      });
      halftone(g, { x0: 600, y0: 150, w: 1200, h: 650, color: C.mint, step: 26, angle: 18, f: (x, y) => clamp(0.32 - Math.hypot(x - 1220, y - 470) / 900) });

      // Morning breakfast touch on left desk: plate + golden croissant + juice glass
      el('ellipse', { cx: 215, cy: 840, rx: 110, ry: 34, fill: C.cream, ...S }, g);
      el('ellipse', { cx: 215, cy: 838, rx: 74, ry: 20, fill: 'none', stroke: C.slate, 'stroke-width': 3 }, g);
      el('path', { d: 'M 155 836 Q 215 782 275 836 Q 215 852 155 836 Z', fill: C.yellow, ...S }, g);
      wRect(g, 118, 725, 52, 86, { rx: 8, fill: C.orange, ...S }, 601);
      el('rect', { x: 124, y: 730, width: 40, height: 14, rx: 4, fill: C.cream }, g);

      const title = chars(g, 'WITHDRAWALS LIVE', {
        x: 84, y: 148, size: 78, family: F.serif, fill: C.navy, stroke: C.cream, sw: 8, shadow: { dx: 7, dy: 7, fill: C.mint },
      });

      // Cheering User sitting cleanly at left-center holding phone
      const user = personRig(g, {
        shirt: C.mint, hair: C.navy, hairStyle: 'wavy', mode: 'desk', expression: 'smile',
      });
      tf(user.g, 435, 585, 0.94);

      // Reposition wall clock cleanly between user/window and phone so nothing overlaps
      tf(office.clkG, 622, 315);

      // Center Giant Phone Screen turning from muted gray to bright green
      const phoneG = el('g', {}, g);
      wRect(phoneG, 755, 200, 425, 575, { rx: 28, fill: C.navy, stroke: C.navy, 'stroke-width': 8 }, 602);
      const scrBg = el('rect', { x: 777, y: 228, width: 381, height: 518, rx: 18, fill: C.night2, stroke: C.cream, 'stroke-width': 4 }, phoneG);
      el('rect', { x: 912, y: 240, width: 110, height: 12, rx: 6, fill: C.navy }, phoneG);
      txt(phoneG, 'BINANCE APP · LIVE', { x: 968, y: 288, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.yellow });
      el('rect', { x: 804, y: 312, width: 326, height: 124, rx: 12, fill: C.night, stroke: C.navy, 'stroke-width': 5 }, phoneG);
      txt(phoneG, 'SPOT WALLET STATUS', { x: 968, y: 348, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 17, 'font-weight': 800, fill: C.sky });
      txt(phoneG, '$12,450.00', { x: 968, y: 408, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 50, fill: C.cream });

      // Animated Withdraw Button: starts gray, snaps vibrant bright green!
      const btnBg = el('rect', { x: 804, y: 468, width: 326, height: 132, rx: 16, fill: C.slate, stroke: C.navy, 'stroke-width': 6 }, phoneG);
      const btnTxt1 = txt(phoneG, 'WITHDRAWALS', { x: 968, y: 522, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 27, 'font-weight': 800, fill: C.cream });
      const btnTxt2 = txt(phoneG, 'RESTORED', { x: 968, y: 568, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 38, fill: C.cream });
      const checkBadge = el('g', { filter: 'url(#boil)' }, phoneG);
      el('circle', { cx: 968, cy: 672, r: 42, fill: C.mint, ...S }, checkBadge);
      el('path', { d: 'M 946 672 L 962 688 L 994 654', fill: 'none', stroke: C.navy, 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, checkBadge);

      // Flying cash bills streaming out toward payout meter
      const bills = Array.from({ length: 10 }, (_, i) => ({ g: billNote(g), i }));

      // Right: 24-Hour Cash-Out Meter Panel ($0.0B -> $4.6B IN 24 HOURS)
      const meterG = el('g', {}, g);
      wRect(meterG, 1300, 225, 535, 515, { rx: 16, fill: C.cream, ...S }, 603);
      el('rect', { x: 1323, y: 248, width: 489, height: 54, rx: 8, fill: C.navy }, meterG);
      txt(meterG, 'CUSTOMER CASH-OUT METER', { x: 1567, y: 283, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.yellow });

      const bigVal = txt(meterG, '$0.0B', {
        x: 1567, y: 446, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 126, fill: C.teal,
      });
      el('rect', { x: 1350, y: 492, width: 435, height: 56, rx: 12, fill: C.paper, stroke: C.navy, 'stroke-width': 5 }, meterG);
      const barFill = el('rect', { x: 1358, y: 500, width: 8, height: 40, rx: 8, fill: C.mint }, meterG);
      txt(meterG, 'IN 24 HOURS', {
        x: 1567, y: 618, 'text-anchor': 'middle', 'font-family': F.serif, 'font-size': 46, 'font-weight': 900, fill: C.navy,
      });
      el('rect', { x: 1390, y: 652, width: 354, height: 48, rx: 10, fill: C.yellow, stroke: C.navy, 'stroke-width': 4 }, meterG);
      txt(meterG, 'PROCESSED · DAY ONE', { x: 1567, y: 684, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });

      return (t) => {
        office.updateOffice(t);
        charsPop(title, t, 378.15);

        const liveP = E.out(seg(t, 378.4, 379.2));
        const isLive = t >= 378.55;
        scrBg.setAttribute('fill', isLive ? '#1F4B45' : C.night2);
        btnBg.setAttribute('fill', isLive ? C.mint : C.slate);
        btnTxt1.setAttribute('fill', isLive ? C.navy : C.cream);
        btnTxt2.setAttribute('fill', isLive ? C.navy : C.cream);
        tf(checkBadge, 0, 0, E.back(seg(t, 378.7, 379.3)));
        op(checkBadge, isLive ? 1 : 0);

        user.setState({
          lookX: 6,
          lookY: -2,
          headRot: Math.sin(t * 3.5) * 2.5,
          blink: t > 381.4 && t < 381.55,
          rArm: [102, 145, 168, 120, 210, 82 + Math.sin(t * 6) * 8],
        });

        const cashP = smooth(seg(t, 379.6, 384.6));
        bigVal.textContent = `$${(4.6 * cashP).toFixed(1)}B`;
        barFill.setAttribute('width', Math.max(10, 419 * cashP).toFixed(1));

        bills.forEach(({ g: bg, i }) => {
          const on = seg(t, 379.4, 380.2);
          op(bg, on);
          const u = ((t - 379.0) * 0.72 + i * 0.1) % 1;
          tf(bg, lerp(1140, 1345, u), 530 - Math.sin(u * Math.PI) * 95 + ((i % 3) - 1) * 26, 0.78, (u - 0.5) * 28);
        });
      };
    });

    // =========================================================================
    // SCENE 6A-2 (386.50 - 394.82s): NOV 12 Binance Emergency Treasury Crater
    // VO: "And by November 12, announced it had plugged the entire $6.3 billion hole out of its own emergency funds and corporate treasury."
    // =========================================================================
    addScene(386.50, 394.82, { dark: false }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.paper }, g);
      halftone(g, { color: C.yellow, step: 24, angle: 20, f: (x, y) => clamp(0.42 - Math.hypot(x - 960, y - 540) / 960) });

      // Architectural industrial bay: steel girder truss along top (below headline!)
      el('rect', { x: 0, y: 186, width: 1920, height: 34, fill: C.slate, stroke: C.navy, 'stroke-width': 5 }, g);
      for (let x = 40; x < 1920; x += 160) {
        el('line', { x1: x, y1: 186, x2: x + 80, y2: 220, stroke: C.navy, 'stroke-width': 4 }, g);
        el('line', { x1: x + 80, y1: 220, x2: x + 160, y2: 186, stroke: C.navy, 'stroke-width': 4 }, g);
      }

      const title = chars(g, 'NOV 12 · BAILOUT', {
        x: 84, y: 148, size: 78, family: F.serif, fill: C.navy, shadow: { dx: 7, dy: 7, fill: C.yellow },
      });

      // Left Ledger Card: Emergency Treasury Funding Sources
      wRect(g, 82, 275, 435, 395, { rx: 14, fill: C.cream, ...S }, 610);
      el('rect', { x: 104, y: 298, width: 391, height: 48, rx: 8, fill: C.navy }, g);
      txt(g, 'BAILOUT RESERVE', { x: 300, y: 330, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.yellow });
      wRect(g, 114, 376, 371, 110, { rx: 10, fill: C.yellow, stroke: C.navy, 'stroke-width': 4 }, 611);
      txt(g, 'SAFU EMERGENCY FUND', { x: 300, y: 422, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });
      txt(g, 'USER PROTECTION POOL', { x: 300, y: 458, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 16, 'font-weight': 800, fill: C.night2 });
      wRect(g, 114, 514, 371, 110, { rx: 10, fill: C.mint, stroke: C.navy, 'stroke-width': 4 }, 612);
      txt(g, 'CORPORATE TREASURY', { x: 300, y: 560, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });
      txt(g, 'INTERNAL RESERVES', { x: 300, y: 596, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 16, 'font-weight': 800, fill: C.night2 });

      // Right Meter: Hole Fill Progress
      wRect(g, 1410, 275, 425, 395, { rx: 14, fill: C.night, stroke: C.navy, 'stroke-width': 6 }, 613);
      txt(g, 'CRATER DEFICIT', { x: 1622, y: 325, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.yellow });
      const craterTxt = txt(g, '-$6.3B', { x: 1622, y: 446, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 96, fill: C.red });
      el('rect', { x: 1445, y: 495, width: 355, height: 48, rx: 10, fill: C.night3, stroke: C.cream, 'stroke-width': 4 }, g);
      const fillProg = el('rect', { x: 1453, y: 503, width: 6, height: 32, rx: 6, fill: C.yellow }, g);
      const craterSub = txt(g, 'FILLING GAP...', { x: 1622, y: 605, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.cream });

      // Chasm Interior (between y=735 and y=1040, x=605..1315)
      el('rect', { x: 600, y: 735, width: 720, height: 345, fill: C.night3 }, g);
      halftone(g, { x0: 600, y0: 735, w: 720, h: 345, color: C.red, step: 24, angle: 22, f: () => 0.30 });
      txt(g, '-$6.3B CHASM', { x: 960, y: 925, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 62, fill: C.red, opacity: 0.55 });

      // Cascading Gold Bullion Bricks inside Chasm (clipped strictly inside chasm!)
      const brickClip = el('clipPath', { id: 'chasmClip' }, g);
      el('rect', { x: 615, y: 735, width: 690, height: 325 }, brickClip);
      const bricksPile = el('g', { 'clip-path': 'url(#chasmClip)' }, g);
      const stackedRows = el('g', {}, bricksPile);
      // Prebuild 7 rows x 6 gold bullion bricks
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 6; col++) {
          const bx = 622 + col * 114 + (row % 2) * 18 - 10;
          const by = 1006 - row * 46;
          el('rect', { x: bx, y: by, width: 104, height: 38, rx: 6, fill: (row + col) % 2 ? C.yellow : C.orange, stroke: C.navy, 'stroke-width': 4 }, stackedRows);
          el('line', { x1: bx + 16, y1: by + 12, x2: bx + 62, y2: by + 12, stroke: C.cream, 'stroke-width': 4, opacity: 0.7 }, stackedRows);
        }
      }

      // Falling bullion bricks pouring continuously from crane hopper into chasm
      const fallingBricks = Array.from({ length: 12 }, (_, i) => {
        const bg = el('g', {}, g);
        el('rect', { x: -38, y: -16, width: 76, height: 32, rx: 5, fill: i % 2 ? C.yellow : C.orange, stroke: C.navy, 'stroke-width': 4 }, bg);
        txt(bg, '$', { x: 0, y: 8, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.navy });
        return { bg, i };
      });

      // Floor Concrete Slabs flanking the crater + animated center Flush Concrete Seal!
      el('rect', { x: -10, y: 735, width: 635, height: 350, fill: C.slate, stroke: C.navy, 'stroke-width': 7 }, g);
      el('rect', { x: 1295, y: 735, width: 635, height: 350, fill: C.slate, stroke: C.navy, 'stroke-width': 7 }, g);
      // Jagged crater lip teeth
      el('polygon', { points: '615,735 635,765 608,820 638,895 612,970 625,1080 595,1080 595,735', fill: C.night2, stroke: C.navy, 'stroke-width': 5 }, g);
      el('polygon', { points: '1305,735 1285,775 1312,835 1282,910 1308,985 1295,1080 1325,1080 1325,735', fill: C.night2, stroke: C.navy, 'stroke-width': 5 }, g);
      // Safety stripe floor edge
      el('rect', { x: 0, y: 724, width: 625, height: 16, fill: 'url(#patStripeDanger)', stroke: C.navy, 'stroke-width': 4 }, g);
      el('rect', { x: 1295, y: 724, width: 625, height: 16, fill: 'url(#patStripeDanger)', stroke: C.navy, 'stroke-width': 4 }, g);

      // Flush Concrete Seal Cap descending smoothly over top of filled crater
      const sealCap = el('g', {}, g);
      el('rect', { x: 618, y: 724, width: 684, height: 48, rx: 6, fill: C.mint, stroke: C.navy, 'stroke-width': 6 }, sealCap);
      txt(sealCap, 'FLOOR SEALED FLUSH · 100% COVERED', { x: 960, y: 756, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });

      // Towering Overhead Gantry Crane stamped SAFU + TREASURY (with girder trolley & cables!)
      const crane = el('g', {}, g);
      // Trolley riding on girder truss (y=186..220) + cables down to crane beam
      el('rect', { x: -115, y: -176, width: 230, height: 22, rx: 6, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, crane);
      el('circle', { cx: -75, cy: -165, r: 9, fill: C.yellow }, crane);
      el('circle', { cx: 75, cy: -165, r: 9, fill: C.yellow }, crane);
      el('line', { x1: -75, y1: -154, x2: -75, y2: -112, stroke: C.navy, 'stroke-width': 7 }, crane);
      el('line', { x1: 75, y1: -154, x2: 75, y2: -112, stroke: C.navy, 'stroke-width': 7 }, crane);
      el('rect', { x: -165, y: -115, width: 330, height: 46, rx: 10, fill: C.yellow, ...S }, crane);
      txt(crane, 'SAFU + TREASURY', { x: 0, y: -84, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.navy });
      el('line', { x1: -85, y1: -69, x2: -65, y2: -10, stroke: C.navy, 'stroke-width': 8 }, crane);
      el('line', { x1: 85, y1: -69, x2: 65, y2: -10, stroke: C.navy, 'stroke-width': 8 }, crane);
      // Tilting Hopper Bucket (#boil)
      const hopper = el('g', { filter: 'url(#boil)' }, crane);
      el('polygon', { points: '-115,-18 115,-18 72,94 -72,94', fill: C.orange, ...S }, hopper);
      txt(hopper, 'BULLION', { x: 0, y: 44, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream });

      const stamp = makeStamp(g, 'HOLE PLUGGED', C.red, 490, 128, 48);

      return (t) => {
        charsPop(title, t, 386.65);

        const fillP = smooth(seg(t, 386.8, 391.4));
        const cx = lerp(680, 960, E.out(seg(t, 386.5, 387.8)));
        tf(crane, cx, 368);
        const tilt = fillP < 0.96 ? -22 * Math.sin(seg(t, 386.9, 387.6) * Math.PI * 0.5) : 0;
        hopper.setAttribute('transform', `rotate(${tilt.toFixed(1)} 0 0)`);

        // Stacked gold bricks rise cleanly inside chasm
        tf(stackedRows, 0, lerp(310, 0, fillP));

        // Pouring stream stops once sealed at 391.4s
        const pouring = t < 391.35;
        fallingBricks.forEach(({ bg, i }) => {
          op(bg, pouring ? 1 : 0);
          if (pouring) {
            const u = ((t - 386.5) * 1.45 + i * 0.083) % 1;
            const bx = cx + ((i % 5) - 2) * 32 + Math.sin(u * 8 + i) * 12;
            const by = lerp(430, 820, u);
            tf(bg, bx, by, 0.95, (i % 2 ? 1 : -1) * u * 35);
          }
        });

        // Concrete floor seals flush right at 391.1->391.6s
        const sealP = E.out(seg(t, 391.0, 391.55));
        op(sealCap, sealP > 0.02 ? 1 : 0);
        tf(sealCap, 0, lerp(-70, 0, sealP));

        fillProg.setAttribute('width', Math.max(8, 339 * fillP).toFixed(1));
        if (fillP >= 0.99) {
          fillProg.setAttribute('fill', C.mint);
          craterTxt.textContent = '$0.00';
          craterTxt.setAttribute('fill', C.mint);
          craterSub.textContent = '100% REIMBURSED';
        } else {
          craterTxt.textContent = `-$${((1 - fillP) * 6.3).toFixed(1)}B`;
        }

        stampAnim(stamp, t, 391.60, 960, 610, -5);
      };
    });

    // =========================================================================
    // SCENE 6B-1 (394.82 - 403.20s): DOJ / FBI Federal Courtroom + Gavel SLAM + cap_09
    // VO: "That same morning, the FBI and the Justice Department got a court order to seize 1.2 billion of the frozen pile"
    // =========================================================================
    addScene(394.82, 403.20, { dark: false }, (g) => {
      E_.decorCourtroom(g);

      const title = chars(g, 'DOJ SEIZES $1.2B', {
        x: 84, y: 148, size: 78, family: F.serif, fill: C.cream, stroke: C.navy, sw: 11, shadow: { dx: 7, dy: 7, fill: C.red },
      });

      // Left Judge Bench Stage: Docket Placard neatly ABOVE gavel swing + Sound Block + Articulated Gavel Arm (#boil)
      el('rect', { x: 140, y: 395, width: 615, height: 132, rx: 12, fill: C.cream, ...S }, g);
      txt(g, 'FEDERAL COURT ORDER', { x: 447, y: 448, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 26, 'font-weight': 800, fill: C.navy });
      txt(g, 'ASSET FORFEITURE · NOV 12', { x: 447, y: 492, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.blue });

        x: 84, y: 148, size: 78, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.mint },

      el('polygon', { points: '1030,540 1120,855 1030,855', fill: C.slate, stroke: C.navy, 'stroke-width': 6 }, wallG);
      // Armored Golden Shield Face (#boil) on front edge
      const shield = el('g', { filter: 'url(#boil)' }, wallG);
      el('path', { d: 'M 735 235 L 925 235 L 925 655 Q 925 790 830 845 Q 735 790 735 655 Z', fill: C.yellow, stroke: C.navy, 'stroke-width': 10, 'stroke-linejoin': 'round' }, shield);
      el('path', { d: 'M 758 262 L 902 262 L 902 645 Q 902 758 830 806 Q 758 758 758 645 Z', fill: C.orange, opacity: 0.45 }, shield);
      // Rivets & Binance Diamond Emblem
      el('polygon', { points: '830,445 878,493 830,541 782,493', fill: C.navy, stroke: C.cream, 'stroke-width': 5 }, shield);
      el('polygon', { points: '830,468 855,493 830,518 805,493', fill: C.yellow }, shield);
      txt(shield, 'BINANCE', { x: 830, y: 345, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 25, 'font-weight': 800, fill: C.navy });

      // Deflection Impact Ripples on Shield Surface
      const impactRipples = [320, 445, 570, 695].map((iy, idx) => {
        const rEl = el('circle', { cx: 742, cy: iy, r: 22, fill: 'none', stroke: C.cream, 'stroke-width': 6 }, g);

      });

      // Storm of 12 Labeled Attack Darts flying into the Shield Wall & Shattering!
      const LABELS = ['FAKE INTERVIEW', 'POISON TOOL', 'MALWARE', 'FAKE STARTUP', 'PHISH DM', 'TROJAN SETUP'];
      const darts = Array.from({ length: 12 }, (_, i) => {
        const dg = el('g', {}, g);
        const lbl = LABELS[i % LABELS.length];
        const col = i % 3 === 0 ? C.red : i % 3 === 1 ? C.pink : C.orange;
        // Dart body + arrow tip
        el('rect', { x: -255, y: -22, width: 220, height: 44, rx: 8, fill: col, stroke: C.navy, 'stroke-width': 5 }, dg);
        el('polygon', { points: '-35,-28 24,0 -35,28', fill: C.cream, stroke: C.navy, 'stroke-width': 5, 'stroke-linejoin': 'round' }, dg);

        const sparks = el('g', {}, g);

        el('polygon', { points: '0,0 -18,-10 -38,-4', fill: C.cream, stroke: C.navy, 'stroke-width': 3 }, sparks);
        return { dg, sparks, i };
      });

      // RIGHT: Giant Mechanical Odometer Counter ticking 01 -> 57 STOPPED!
      wRect(g, 1190, 235, 645, 580, { rx: 18, fill: C.navy, stroke: C.cream, 'stroke-width': 6 }, 671);
      el('rect', { x: 1222, y: 266, width: 581, height: 56, rx: 10, fill: C.night3, stroke: C.mint, 'stroke-width': 3 }, g);
      txt(g, '2026 ATTACKS DEFLECTED', { x: 1512, y: 302, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 23, 'font-weight': 800, fill: C.mint });

      // Brass Odometer Window
      wRect(g, 1265, 355, 495, 250, { rx: 16, fill: C.cream, stroke: C.yellow, 'stroke-width': 7 }, 672);
      el('line', { x1: 1512, y1: 358, x2: 1512, y2: 602, stroke: C.slate, 'stroke-width': 4, opacity: 0.35 }, g);
      const odoTxt = txt(g, '01', { x: 1512, y: 545, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 195, fill: C.navy });

      const stopBadge = el('g', {}, g);
      const stopRect = wRect(stopBadge, 1265, 642, 495, 118, { rx: 14, fill: C.yellow, stroke: C.cream, 'stroke-width': 5 }, 673);
      const stopTxt = txt(stopBadge, 'BLOCKING ATTACKS...', { x: 1512, y: 713, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 42, fill: C.navy });
      const stopSub = txt(g, 'COUNTERING LURES IN 2026', { x: 1512, y: 794, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.yellow });

      return (t) => {
        charsPop(title, t, 460.22);

        // Rapid Odometer climb 01 -> 57 reaching 57 right at 470.5s
        const odoP = smooth(seg(t, 460.2, 470.5));
        const val = Math.max(1, Math.min(57, Math.round(1 + 56 * odoP)));
        odoTxt.textContent = String(val).padStart(2, '0');

        const locked = val >= 57;
        stopRect.setAttribute('fill', locked ? C.mint : C.yellow);
        stopTxt.textContent = locked ? '57 STOPPED!' : `${val} / 57 BLOCKED`;
        stopTxt.setAttribute('font-size', locked ? '56' : '46');
        stopSub.textContent = locked ? 'ALL 57 CAUGHT IN 2026' : 'SHIELD WALL ENGAGED';

        // Continuous wave of darts hitting shield edge x = 735 and rebounding/shattering cleanly
        darts.forEach(({ dg, sparks, i }) => {
          const cyc = ((t - 460.1) * 0.96 + i * 0.19) % 1.05;
          const yBase = 265 + ((i * 117) % 520);
          if (cyc < 0.72) {
            // Flying straight right toward shield
            const u = cyc / 0.72;
            const x = lerp(-80, 728, u);
            op(dg, 1);
            tf(dg, x, yBase, 1, 0);
            op(sparks, 0);
          } else {
            // Quick crisp shatter & fade without lingering dark ghosts
            const u = (cyc - 0.72) / 0.33;
            op(dg, Math.max(0, 1 - u * 2.2));
            tf(dg, lerp(725, 625, u), yBase + (i % 2 ? 1 : -1) * u * 45, 1, (i % 2 ? 1 : -1) * u * 35);
            op(sparks, Math.max(0, 1 - u * 1.3));
            tf(sparks, 730, yBase, 0.9 + u * 0.9, u * 30);
          }
        });

        impactRipples.forEach(({ rEl, idx }) => {
          const rp = ((t * 1.6 + idx * 0.25) % 1);
          rEl.setAttribute('r', (14 + rp * 54).toFixed(1));
          op(rEl, (1 - rp) * 0.85);
        });
      };
    });

    // =========================================================================
    // SCENE 6E-4 (473.60 - 478.30s): Ultra-Tight Macro Hairline Gap — ONLY 70 BYTES
    // VO: "It only took one 70-byte file to make it through."
    // =========================================================================
    addScene(473.60, 478.30, {
      dark: true,
      camFn: (t) => {
        const k = 1 + 0.065 * smooth(seg(t, 473.6, 478.3));
        return `translate(960 560) scale(${k.toFixed(4)}) translate(-960 -560)`;
      },
    }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: '#0A0E1E' }, g);

      // Massive Dark Armored Shield Plate above (y: 0..540) with scratched dents
      el('rect', { x: -20, y: -20, width: 1960, height: 560, fill: C.night2, stroke: C.navy, 'stroke-width': 10 }, g);
      el('rect', { x: -20, y: 500, width: 1960, height: 40, fill: C.slate, stroke: C.navy, 'stroke-width': 6 }, g);
      for (let rx = 140; rx < 1920; rx += 260) {
        el('circle', { cx: rx, cy: 460, r: 16, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, g);
      }
      txt(g, 'ARMOR PLATE // 57 DEFLECTED', { x: 1840, y: 404, 'text-anchor': 'end', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.mint, opacity: 0.85 });

      // Heavy Concrete/Steel Foundation Floor Slab below (y: 590..1080)
      el('rect', { x: -20, y: 590, width: 1960, height: 510, fill: C.night, stroke: C.navy, 'stroke-width': 10 }, g);
      el('rect', { x: -20, y: 590, width: 1960, height: 22, fill: 'url(#patStripeDanger)', stroke: C.navy, 'stroke-width': 4 }, g);

      // THE 2MM HAIRLINE SEAM GAP (y: 540..590) emitting eerie golden slit glow
      el('rect', { x: 0, y: 540, width: 1920, height: 50, fill: '#050711' }, g);
      el('rect', { x: 780, y: 556, width: 1140, height: 18, fill: C.yellow, opacity: 0.22 }, g);
      halftone(g, { x0: 600, y0: 420, w: 1320, h: 290, color: C.yellow, step: 20, angle: 12, f: (x, y) => clamp(0.45 - Math.abs(y - 565) / 145) * clamp((x - 600) / 800), opacity: 0.55 });

      // Vertical Armor Seam Line (x=960) showing outside vs inside vault
      el('line', { x1: 960, y1: 180, x2: 960, y2: 540, stroke: C.cream, 'stroke-width': 4, 'stroke-dasharray': '12 10', opacity: 0.4 }, g);
      txt(g, 'OUTSIDE', { x: 925, y: 365, 'text-anchor': 'end', 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.sky });
      txt(g, 'INSIDE VAULT', { x: 995, y: 365, 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.yellow });

      const title = chars(g, 'ONLY 70 BYTES', {
        x: 84, y: 148, size: 82, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.red },
      });

      // Tiny Glowing 70 BYTES Needle / File gliding silently straight through the hairline gap!
      const needle = el('g', { filter: 'url(#boil)' }, g);
      el('line', { x1: -260, y1: 0, x2: -42, y2: 0, stroke: C.pink, 'stroke-width': 6, opacity: 0.7 }, needle);
      el('polygon', { points: '-42,-12 36,-12 72,0 36,12 -42,12', fill: C.yellow, stroke: C.navy, 'stroke-width': 5, 'stroke-linejoin': 'round' }, needle);
      el('circle', { cx: 12, cy: 0, r: 5, fill: C.red }, needle);
      // Floating glowing tag attached above needle
      el('line', { x1: 0, y1: -14, x2: 0, y2: -62, stroke: C.yellow, 'stroke-width': 3 }, needle);
      el('rect', { x: -110, y: -116, width: 220, height: 54, rx: 10, fill: C.red, stroke: C.cream, 'stroke-width': 4 }, needle);
      txt(needle, '70 BYTES', { x: 0, y: -79, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 32, fill: C.cream });

      // Bottom Scoreboard Contrast: 57 STOPPED · 1 GOT THROUGH
      wRect(g, 90, 710, 620, 235, { rx: 16, fill: C.night2, stroke: C.mint, 'stroke-width': 5 }, 680);
      txt(g, '57 STOPPED', { x: 400, y: 825, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 82, fill: C.mint });
      txt(g, 'BLOCKED AT THE WALL', { x: 400, y: 895, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream });

      wRect(g, 1180, 710, 650, 235, { rx: 16, fill: C.night3, stroke: C.red, 'stroke-width': 6 }, 681);
      txt(g, '1 GOT THROUGH', { x: 1505, y: 825, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 72, fill: C.red });
      txt(g, 'ZERO ALERTS · SILENT ENTRY', { x: 1505, y: 895, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.yellow });

      return (t) => {
        charsPop(title, t, 473.72);
        const glide = smooth(seg(t, 473.75, 478.00));
        tf(needle, lerp(280, 1460, glide), 565);
      };
    });

    // =========================================================================
    // SCENE 6F (478.30 - 483.50s): Cinematic YouTube Outro Sting (End-Screen Safe Margins!)
    // Center Archive Summary Sheet x: 540..1380 -> leaves x < 520 and x > 1400 completely open!
    // =========================================================================
    addScene(478.30, 483.50, { dark: false }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.paper }, g);
      // Centered halftone spotlight strictly behind center dossier sheet (keeps left & right margins ultra clean)
      halftone(g, { x0: 460, y0: 120, w: 1000, h: 860, color: C.yellow, step: 24, angle: 18, f: (x, y) => clamp(0.55 - Math.hypot(x - 960, y - 550) / 520) });

      const title = chars(g, 'THE $6.3B FILE', {
        x: 84, y: 148, size: 74, family: F.serif, fill: C.navy, shadow: { dx: 7, dy: 7, fill: C.yellow },

      // Centered Final Archive Summary Sheet (strictly x: 540..1380!)
      const sheet = el('g', {}, g);
      el('rect', { x: 552, y: 204, width: 840, height: 765, rx: 18, fill: C.navy, class: 'mul', opacity: 0.22 }, sheet);

      const rows = [
        ['$6.3B DRAINED', 'CROSS-CHAIN HOT WALLET BREACH', C.red],

      rows.forEach(([num, desc, col], idx) => {

      const openStamp = makeStamp(g, 'CASE STATUS: OPEN', C.red, 540, 120, 44);

      return (t) => {
        charsPop(title, t, 478.42);
        const pop = E.out(seg(t, 478.30, 478.80));
        tf(sheet, 0, lerp(30, 0, pop));
        stampAnim(openStamp, t, 479.30, 960, 852, -5);

    });
  },
});
