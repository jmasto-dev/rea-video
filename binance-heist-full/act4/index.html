<script>
const E_ = window.Engine;
const { C, F, el, txt, tf, op, show, clamp, seg, lerp, smooth, E, wRect, wLine, chars, charsPop, halftone, makeStamp, stampAnim, billNote, personRig, mountCapture } = E_;

E_.createStage({
  actNum: 4,
  actTitle: 'LATERAL MOVEMENT & 50 BLANKS',
  actOffset: 4084 / 24, // 170.1667s exact 24fps
  frames: 2446,         // 170.1667s -> 272.0833s (101.9167s)
  assets: ['captures/cap_06_etherscan_mixer.png'],
  wipes: [
    [180.38, C.blue],
    [195.90, C.orange],
    [210.54, C.yellow],
    [223.50, C.pink],
    [238.46, C.mint],
    [250.06, C.yellow],
  ],
  shakes: [
    [173.40, 12, 0.22],
    [176.25, 14, 0.25],
    [204.00, 14, 0.26],
    [216.80, 14, 0.24],
    [235.60, 12, 0.22],
    [244.20, 14, 0.24],
    [247.50, 16, 0.28],
    [256.80, 10, 0.16],
    [257.60, 10, 0.16],
    [258.40, 10, 0.16],
    [259.20, 10, 0.16],
  ],
  flashes: [
    [176.25, 0.25, 0.18],
    [204.00, 0.28, 0.18],
    [247.50, 0.30, 0.20],
  ],
  hudCues: [
    [170.16, 'INFILTRATION'],
    [180.38, 'OCT 20 · BRIDGE'],
    [195.90, 'LATERAL JUMP'],
    [210.54, 'DEPLOY_TOKEN'],
    [223.50, 'OCT 28 · MIXER'],
    [233.50, 'OCT 29 · 5:15 PM'],
    [238.46, 'PROD CONTAINER'],
    [250.06, '50 BLANK SLIPS'],
  ],

  buildScenes(addScene) {
    const S = { stroke: C.navy, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

    // Helper for small industrial gear wheel
    function drawGear(parent, cx, cy, r, teeth, fill, hubFill = C.cream) {
      const g = el('g', {}, parent);
      tf(g, cx, cy);
      for (let i = 0; i < teeth; i++) {
        el('rect', {
          x: -11, y: -r - 16, width: 22, height: 24, rx: 4,
          fill, stroke: C.navy, 'stroke-width': 5,
          transform: `rotate(${(i * 360 / teeth).toFixed(1)})`
        }, g);
      }
      el('circle', { cx: 0, cy: 0, r, fill, stroke: C.navy, 'stroke-width': 6 }, g);
      el('circle', { cx: 0, cy: 0, r: r * 0.62, fill: 'none', stroke: C.navy, 'stroke-width': 4, opacity: 0.45 }, g);
      el('circle', { cx: 0, cy: 0, r: r * 0.28, fill: hubFill, stroke: C.navy, 'stroke-width': 5 }, g);
      return g;
    }

    // Helper for Deploy Token Hexagonal Badge
    function drawDeployBadge(parent, x, y, sc = 1) {
      const g = el('g', { filter: 'url(#boil)' }, parent);
      tf(g, x, y, sc);
      // Offset drop shadow
      el('polygon', {
        points: '10,-122 126,-56 126,76 10,142 -106,76 -106,-56',
        fill: C.navy, opacity: 0.55
      }, g);
      // Brushed gold outer hex
      el('polygon', {
        points: '0,-132 116,-66 116,66 0,132 -116,66 -116,-66',
        fill: C.yellow, stroke: C.navy, 'stroke-width': 8, 'stroke-linejoin': 'round'
      }, g);
      // Inner recessed plate
      el('polygon', {
        points: '0,-106 92,-53 92,53 0,106 -92,53 -92,-53',
        fill: C.night, stroke: C.navy, 'stroke-width': 5, 'stroke-linejoin': 'round'
      }, g);
      // Keyring & circuit notches
      el('circle', { cx: 0, cy: -84, r: 10, fill: C.yellow, stroke: C.navy, 'stroke-width': 4 }, g);
      el('rect', { x: -72, y: -28, width: 144, height: 56, rx: 8, fill: C.yellow, stroke: C.navy, 'stroke-width': 4 }, g);
      txt(g, 'DEPLOY_TOKEN', {
        x: 0, y: 7, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 17, 'font-weight': 800, fill: C.navy
      });
      txt(g, 'PROD // AUTH', {
        x: 0, y: 56, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 15, 'font-weight': 800, fill: C.mint
      });
      return g;
    }

    // =========================================================================
    // SCENE 4A (170.17 - 180.38s): Vault Turnstile -> Fortress Cross-Section
    // VO: "Now, you might be thinking, why go through all that trouble for a guy who doesn't even hold the keys to the vault? Because he doesn't need to. He just needs to be inside the building."
    // =========================================================================
    addScene(170.1667, 180.38, { dark: true }, (g) => {
      // ---- BEAT 1 (170.17 - 175.50s): Titanium Vault Door + Access Denied ----
      const b1 = el('g', {}, g);
      E_.decorVaultHall(b1, { groundY: 850 });
      const t1 = chars(b1, 'NO VAULT KEYS', {
        x: 84, y: 150, size: 74, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.blue },
      });

      // Security Turnstile Corridor
      wRect(b1, 700, 620, 260, 230, { rx: 10, fill: C.slate, ...S }, 401);
      el('rect', { x: 735, y: 650, width: 190, height: 34, rx: 6, fill: C.night3, stroke: C.cream, 'stroke-width': 3 }, b1);
      txt(b1, 'CARD SCANNER', { x: 830, y: 673, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 17, 'font-weight': 800, fill: C.yellow });
      const scanLed = el('rect', { x: 780, y: 710, width: 100, height: 42, rx: 8, fill: C.red, stroke: C.navy, 'stroke-width': 4 }, b1);
      const scanTxt = txt(b1, 'SCAN...', { x: 830, y: 738, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 18, 'font-weight': 800, fill: C.cream });

      // Giant Circular Titanium Vault Door blocking right corridor
      wRect(b1, 1045, 200, 760, 650, { rx: 16, fill: C.night2, stroke: C.cream, 'stroke-width': 6 }, 402);
      el('rect', { x: 1185, y: 218, width: 480, height: 48, rx: 8, fill: C.night3, stroke: C.yellow, 'stroke-width': 4 }, b1);
      txt(b1, 'VAULT MASTER KEYS // LOCKED', { x: 1425, y: 249, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.yellow });
      el('circle', { cx: 1425, cy: 565, r: 245, fill: C.slate, stroke: C.cream, 'stroke-width': 10 }, b1);
      el('circle', { cx: 1425, cy: 565, r: 205, fill: C.night3, stroke: C.navy, 'stroke-width': 6 }, b1);
      for (let a = 0; a < 12; a++) {
        const ang = (a / 12) * Math.PI * 2;
        el('circle', { cx: 1425 + Math.cos(ang) * 224, cy: 565 + Math.sin(ang) * 224, r: 7, fill: C.cream }, b1);
      }
      // Spoked locking wheel
      el('circle', { cx: 1425, cy: 565, r: 95, fill: 'none', stroke: C.yellow, 'stroke-width': 18 }, b1);
      for (let s = 0; s < 6; s++) {
        const ang = (s / 6) * Math.PI * 2;
        el('line', { x1: 1425, y1: 565, x2: 1425 + Math.cos(ang) * 95, y2: 565 + Math.sin(ang) * 95, stroke: C.yellow, 'stroke-width': 12 }, b1);
      }
      el('circle', { cx: 1425, cy: 565, r: 30, fill: C.navy, stroke: C.yellow, 'stroke-width': 6 }, b1);

      // Engineer #2 scanning badge
      const eng2 = personRig(b1, { shirt: C.teal, hair: C.navy, hairStyle: 'wavy', badge: true, expression: 'neutral' });
      tf(eng2.g, 415, 620, 0.98);
      const badgeCard = el('g', {}, b1);
      el('rect', { x: -34, y: -22, width: 68, height: 44, rx: 6, fill: C.yellow, ...S }, badgeCard);
      txt(badgeCard, 'ENG#2', { x: 0, y: 6, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 15, 'font-weight': 800, fill: C.navy });

      const denyStamp = makeStamp(b1, 'NO VAULT KEYS', C.red, 480, 118, 44);
      const denyBanner = el('g', {}, b1);
      wRect(denyBanner, 120, 895, 620, 56, { rx: 10, fill: C.red, stroke: C.cream, 'stroke-width': 4 }, 403);
      txt(denyBanner, 'ACCESS DENIED: NO VAULT KEYS', { x: 430, y: 931, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.cream });

      // ---- BEAT 2 (175.50 - 180.38s): Fortress Cross-Section Cutaway ----
      const b2 = el('g', {}, g);
      el('rect', { width: 1920, height: 1080, fill: C.night3 }, b2);
      // Left exterior stormy zone
      el('rect', { x: 0, y: 0, width: 790, height: 860, fill: C.night }, b2);
      halftone(b2, { x0: 0, y0: 0, w: 790, h: 860, color: C.blue, step: 26, angle: 16, f: (x, y) => clamp(0.45 - Math.hypot(x - 320, y - 420) / 760) });
      // Crescent moon & exterior night skyline silhouettes (clear of headline!)
      el('circle', { cx: 185, cy: 270, r: 34, fill: C.yellow }, b2);
      el('circle', { cx: 200, cy: 262, r: 29, fill: C.night }, b2);
      for (const [bx, bh] of [[70, 220], [160, 310], [260, 190], [360, 260], [460, 180]]) {
        el('rect', { x: bx, y: 860 - bh, width: 78, height: bh, fill: C.night2, stroke: C.navy, 'stroke-width': 4 }, b2);
      }
      // Right warm illuminated inner courtyard corridor!
      el('rect', { x: 790, y: 195, width: 1130, height: 665, fill: '#2B355C', stroke: C.cream, 'stroke-width': 5 }, b2);
      halftone(b2, { x0: 790, y0: 195, w: 1130, h: 665, color: C.yellow, step: 24, angle: 18, f: (x, y) => clamp(0.50 - Math.hypot(x - 1340, y - 490) / 780) });
      // Courtyard arched colonnade & glowing pendant lamps
      for (const px of [930, 1240, 1550]) {
        wRect(b2, px, 240, 68, 620, { rx: 4, fill: C.cream, ...S }, px);
        el('rect', { x: px - 14, y: 226, width: 96, height: 28, rx: 4, fill: C.yellow, ...S }, b2);
        el('rect', { x: px - 14, y: 830, width: 96, height: 30, rx: 4, fill: C.slate, ...S }, b2);
      }
      for (const lx of [1110, 1420, 1730]) {
        el('polygon', { points: `${lx - 20},250 ${lx + 20},250 ${lx + 150},860 ${lx - 150},860`, fill: 'url(#patDotsGold)', opacity: 0.32 }, b2);
        el('line', { x1: lx, y1: 195, x2: lx, y2: 230, stroke: C.cream, 'stroke-width': 4 }, b2);
        el('path', { d: `M ${lx - 38} 254 C ${lx - 30} 222 ${lx + 30} 222 ${lx + 38} 254 Z`, fill: C.yellow, ...S }, b2);
      }
      el('rect', { x: 1680, y: 400, width: 180, height: 460, rx: 10, fill: C.night2, stroke: C.mint, 'stroke-width': 6 }, b2);
      txt(b2, 'INNER', { x: 1770, y: 485, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.mint });
      txt(b2, 'SYSTEMS', { x: 1770, y: 515, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.mint });

      // Ground floor & thick stone/steel Fortress Perimeter Wall dividing outside & inside!
      el('rect', { x: 0, y: 860, width: 1920, height: 220, fill: C.night2, stroke: C.navy, 'stroke-width': 7 }, b2);
      el('rect', { x: 0, y: 852, width: 1920, height: 14, fill: 'url(#patStripeDanger)' }, b2);
      wRect(b2, 715, 225, 110, 635, { rx: 6, fill: C.slate, stroke: C.cream, 'stroke-width': 6 }, 404);
      for (let wy = 270; wy < 840; wy += 68) el('line', { x1: 720, y1: wy, x2: 820, y2: wy, stroke: C.navy, 'stroke-width': 4 }, b2);
      el('rect', { x: 678, y: 188, width: 184, height: 38, rx: 6, fill: C.night2, stroke: C.cream, 'stroke-width': 4 }, b2);
      txt(b2, 'PERIMETER WALL', { x: 770, y: 213, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 16, 'font-weight': 800, fill: C.yellow });

      // Outside Patrolling Security Guards with Flashlight Cones watching outside wall
      const guards = [245, 490].map((gx, idx) => {
        const gg = el('g', { filter: 'url(#boil)' }, b2);
        tf(gg, gx, 745);
        // Flashlight beam pointing left/outward away from courtyard!
        el('polygon', { points: '-42,-8 -245,-70 -245,95 -42,16', fill: 'url(#patDotsGold)', opacity: 0.65 }, gg);
        // Legs & boots
        el('rect', { x: -20, y: 65, width: 16, height: 48, rx: 4, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, gg);
        el('rect', { x: 4, y: 65, width: 16, height: 48, rx: 4, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, gg);
        el('rect', { x: -30, y: -40, width: 60, height: 112, rx: 14, fill: C.blue, ...S }, gg);
        el('circle', { cx: 0, cy: -66, r: 30, fill: C.skin, ...S }, gg);
        el('path', { d: 'M -36 -74 L 36 -74 L 22 -98 L -22 -98 Z', fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, gg);
        el('rect', { x: -46, y: -76, width: 22, height: 8, rx: 3, fill: C.navy }, gg);
        el('rect', { x: -58, y: -14, width: 28, height: 16, rx: 4, fill: C.yellow, ...S }, gg);
        return { gg, gx, idx };
      });
      wRect(b2, 130, 900, 460, 50, { rx: 8, fill: C.navy, stroke: C.cream, 'stroke-width': 3 }, 405);
      txt(b2, 'GUARDS WATCHING OUTSIDE', { x: 360, y: 932, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 20, 'font-weight': 800, fill: C.cream });

      // Glowing-Eyed Intruder leaning casually against Inner Courtyard Pillar!
      const intruder = el('g', { filter: 'url(#boil)' }, b2);
      tf(intruder, 1345, 650);
      el('path', { d: 'M -65 210 L -52 -30 C -48 -95 48 -95 52 -30 L 65 210 Z', fill: '#0A0D1A', stroke: C.cream, 'stroke-width': 6 }, intruder);
      // Hood & glowing pink eyes
      el('path', { d: 'M -52 -40 C -52 -130 52 -130 52 -40 Z', fill: '#0A0D1A', stroke: C.cream, 'stroke-width': 6 }, intruder);
      el('circle', { cx: -18, cy: -58, r: 8, fill: C.pink }, intruder);
      el('circle', { cx: 18, cy: -58, r: 8, fill: C.pink }, intruder);
      // Casual crossed arms + glowing phone/coffee
      el('path', { d: 'M -42 30 Q 0 55 44 25', fill: 'none', stroke: C.cream, 'stroke-width': 12, 'stroke-linecap': 'round' }, intruder);
      wRect(b2, 1080, 900, 560, 50, { rx: 8, fill: C.pink, stroke: C.cream, 'stroke-width': 4 }, 406);
      txt(b2, 'ALREADY INSIDE THE BUILDING', { x: 1360, y: 932, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.navy });

      const t2 = chars(b2, 'INSIDE THE BUILDING', {
        x: 84, y: 150, size: 78, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.pink },
      });
      const inStamp = makeStamp(b2, 'ALREADY INSIDE', C.pink, 500, 120, 44);

      return (t) => {
        const beat2 = t >= 175.50;
        show(b1, !beat2);
        show(b2, beat2);

        if (!beat2) {
          charsPop(t1, t, 170.30);
          const reach = E.out(seg(t, 171.6, 173.1));
          eng2.setState({ lookX: 8, lookY: 2, rArm: [102, 145, lerp(155, 220, reach), lerp(195, 130, reach), lerp(110, 315, reach), lerp(230, 105, reach)] });
          tf(badgeCard, lerp(540, 765, reach), lerp(765, 725, reach), 1, lerp(-12, 6, reach));
          if (t >= 173.3) {
            scanLed.setAttribute('fill', C.red);
            scanTxt.textContent = 'DENIED';
          }
          stampAnim(denyStamp, t, 173.40, 1140, 430, -9);
          op(denyBanner, E.out(seg(t, 173.4, 173.9)));
        } else {
          charsPop(t2, t, 175.60);
          guards.forEach(({ gg, gx, idx }) => {
            const dx = Math.sin(t * 2.2 + idx * 1.4) * 32;
            tf(gg, gx + dx, 745);
          });
          tf(intruder, 1355, 650 + Math.sin(t * 2.6) * 3);
          stampAnim(inStamp, t, 176.25, 1230, 340, -7);
        }
      };
    });

    // =========================================================================
    // SCENE 4B (180.38 - 195.90s): OCT 20 Dark-Mode Isometric Architectural Network Map
    // VO: "On October 20th, sitting silently inside that second engineer's laptop, the attackers don't look for crypto wallets. They look for a bridge. And they find one, right inside Binance's own office software, an internal AI tool."
    // =========================================================================
    addScene(180.38, 195.90, { dark: true }, (g) => {
      el('rect', { width: 1920, height: 1080, fill: C.night3 }, g);
      halftone(g, { color: C.blue, step: 28, angle: 16, f: (x, y) => clamp(0.42 - Math.hypot(x - 960, y - 560) / 1100) });

      // Isometric blueprint grid floor across stage
      for (let i = -8; i <= 14; i++) {
        el('line', { x1: i * 190 - 200, y1: 1080, x2: i * 190 + 700, y2: 140, stroke: C.night2, 'stroke-width': 2.5, opacity: 0.55 }, g);
        el('line', { x1: i * 190 + 200, y1: 1080, x2: i * 190 - 700, y2: 140, stroke: C.night2, 'stroke-width': 2.5, opacity: 0.55 }, g);
      }

      const title = chars(g, 'OCT 20 · THE BRIDGE', {
        x: 84, y: 150, size: 78, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.yellow },
      });

      // Top-Right Armored COLD WALLETS [SEALED] Wing (skipped by attackers)
      const coldG = el('g', {}, g);
      // Isometric 3D thick steel slab
      el('polygon', { points: '1040,185 1780,185 1840,265 1100,265', fill: C.slate, ...S }, coldG);
      el('polygon', { points: '1100,265 1840,265 1840,340 1100,340', fill: C.night2, ...S }, coldG);
      el('polygon', { points: '1040,185 1100,265 1100,340 1040,260', fill: C.night, ...S }, coldG);
      el('rect', { x: 1125, y: 202, width: 620, height: 48, rx: 6, fill: C.night3, stroke: C.mint, 'stroke-width': 4 }, coldG);
      txt(coldG, 'COLD WALLETS // [SEALED · IGNORED]', {
        x: 1435, y: 233, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.mint,
      });
      // Armored vault lock icons on slab
      for (const lx of [1180, 1435, 1690]) {
        el('rect', { x: lx - 20, y: 280, width: 40, height: 34, rx: 5, fill: C.yellow, stroke: C.navy, 'stroke-width': 4 }, coldG);
        el('path', { d: `M ${lx - 11} 280 L ${lx - 11} 268 A 11 11 0 0 1 ${lx + 11} 268 L ${lx + 11} 280`, fill: 'none', stroke: C.cream, 'stroke-width': 5 }, coldG);
      }

      // Dark Jagged Chasm separating Office LAN & Wallet Core
      el('polygon', {
        points: '730,360 1185,360 1235,510 1160,670 1225,860 1140,1040 675,1040 735,840 665,650 755,480',
        fill: '#080B1A', stroke: C.navy, 'stroke-width': 7
      }, g);
      // Chasm jagged cliff rim walls
      el('polyline', { points: '730,360 755,480 665,650 735,840 675,1040', fill: 'none', stroke: C.blue, 'stroke-width': 6, opacity: 0.7 }, g);
      el('polyline', { points: '1185,360 1235,510 1160,670 1225,860 1140,1040', fill: 'none', stroke: C.pink, 'stroke-width': 6, opacity: 0.7 }, g);
      txt(g, 'AIRGAP / FIREWALL CHASM', {
        x: 952, y: 970, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 22, 'font-weight': 800, fill: C.slate,
      });

      // Left Isometric Platform: CORPORATE OFFICE LAN
      el('polygon', { points: '95,380 710,380 650,860 55,860', fill: C.night2, ...S }, g);
      el('polygon', { points: '55,860 650,860 650,920 55,920', fill: C.night, ...S }, g);
      el('rect', { x: 118, y: 400, width: 470, height: 48, rx: 8, fill: C.night3, stroke: C.cream, 'stroke-width': 3 }, g);
      txt(g, 'CORPORATE OFFICE LAN', { x: 353, y: 431, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 21, 'font-weight': 800, fill: C.cream });

      // Engineer #2 Laptop Node waking amber on Left Platform
      const nodeRing1 = el('circle', { cx: 360, cy: 615, r: 95, fill: 'none', stroke: C.yellow, 'stroke-width': 5, 'stroke-dasharray': '12 8' }, g);
      const nodeRing2 = el('circle', { cx: 360, cy: 615, r: 132, fill: 'none', stroke: C.orange, 'stroke-width': 4 }, g);
      wRect(g, 245, 530, 230, 145, { rx: 10, fill: C.night3, stroke: C.yellow, 'stroke-width': 6 }, 411);
      el('rect', { x: 268, y: 552, width: 184, height: 85, rx: 5, fill: C.orange }, g);
      txt(g, 'ENG #2', { x: 360, y: 598, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 24, 'font-weight': 800, fill: C.navy });
      txt(g, '70-BYTE FOOTHOLD', { x: 360, y: 626, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 14, 'font-weight': 800, fill: C.navy });
      el('polygon', { points: '220,680 500,680 525,710 195,710', fill: C.cream, ...S }, g);
      // Office software icon stack

        el('rect', { x: 12, y: 20, width: 84, height: 26, rx: 4, fill: C.mint, stroke: C.navy, 'stroke-width': 3 }, sg);
        txt(sg, 'VALID', { x: 54, y: 38, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 14, 'font-weight': 800, fill: C.navy });
        return sg;
      });
      const fanLabel = el('g', {}, chamber);
      wRect(fanLabel, 1450, 775, 420, 58, { rx: 10, fill: C.yellow, stroke: C.navy, 'stroke-width': 5 }, 475);
      txt(fanLabel, 'PRE-SIGNED: 50 BLANKS', { x: 1660, y: 812, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 23, 'font-weight': 800, fill: C.navy });

      // ZONE 3 (World x: 1850..3250): Curved Brass Pneumatic Tube -> Spinning ETH Nonce Queue Odometer Gear
      // Curved brass chute shooting from world x=1790 up & right to x=2320 (cleanly clear of slip card text!)
      el('path', { d: 'M 1785 690 C 1980 690 2060 310 2320 310', fill: 'none', stroke: C.navy, 'stroke-width': 58, 'stroke-linecap': 'round' }, chamber);
      el('path', { d: 'M 1785 690 C 1980 690 2060 310 2320 310', fill: 'none', stroke: C.yellow, 'stroke-width': 40, 'stroke-linecap': 'round' }, chamber);
      el('path', { d: 'M 1785 690 C 1980 690 2060 310 2320 310', fill: 'none', stroke: C.cream, 'stroke-width': 12, 'stroke-dasharray': '16 14', opacity: 0.7 }, chamber);
      // Chute mouth flange
      wRect(chamber, 2295, 255, 42, 110, { rx: 8, fill: C.orange, ...S }, 476);

      // Hovering Stack of 50 Slips poised above Ethereum Nonce Queue Gear
      const hoverStack = el('g', { filter: 'url(#boil)' }, chamber);
      tf(hoverStack, 2740, 315);
      for (let k = 4; k >= 0; k--) {
        el('rect', { x: -165 + k * 8, y: -55 + k * 8, width: 330, height: 110, rx: 10, fill: k === 0 ? C.yellow : C.cream, stroke: C.navy, 'stroke-width': 5 }, hoverStack);
      }
      txt(hoverStack, '50 SIGNED SLIPS', { x: 0, y: -6, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 23, 'font-weight': 800, fill: C.navy });
      txt(hoverStack, 'POISED FOR EXACT NONCE', { x: 0, y: 26, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 16, 'font-weight': 800, fill: C.red });
      // Target drop arrow pointing straight down at gear slot
      el('path', { d: 'M 2740 392 L 2740 448', stroke: C.pink, 'stroke-width': 12, 'stroke-linecap': 'round' }, chamber);
      el('polygon', { points: '2715,438 2765,438 2740,472', fill: C.pink }, chamber);

      // Giant Spinning Ethereum Nonce Queue Odometer Gear (world cx=2740, cy=685)
      const nonceGear = drawGear(chamber, 2740, 685, 195, 16, C.blue, C.yellow);
      // Odometer Queue Counter Readout Plaque overlaying lower hub
      wRect(chamber, 2495, 625, 490, 120, { rx: 14, fill: C.night3, stroke: C.yellow, 'stroke-width': 6 }, 478);
      txt(chamber, 'ETH NONCE QUEUE COUNTER', { x: 2740, y: 662, 'text-anchor': 'middle', 'font-family': F.mono, 'font-size': 19, 'font-weight': 800, fill: C.mint });
      const nonceReadout = txt(chamber, '#104,881', { x: 2740, y: 718, 'text-anchor': 'middle', 'font-family': F.bagel, 'font-size': 50, fill: C.yellow });

      // Screen-space Headlines
      const tA = chars(g, '50 BLANK CHECKS', {
        x: 84, y: 150, size: 78, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.yellow },
      });
      const tB = chars(g, 'WAITING FOR A MATCH', {
        x: 84, y: 150, size: 74, family: F.serif, fill: C.cream, shadow: { dx: 7, dy: 7, fill: C.pink },
      });

      return (t) => {
        const beatB = t >= 262.0;
        show(tA.g, !beatB);
        show(tB.g, beatB);
        if (!beatB) charsPop(tA, t, 250.20);
        else charsPop(tB, t, 262.10);

        // Smooth camera pan across Vault Chamber:
        // 250..252.5: 0 (shows Master Keys + Teller entering)
        // 252.5..255.2: 0 -> -460 (Teller centered + 50 slip fan!)
        // 261.8..264.5: -460 -> -1380 (Pneumatic chute + 50 slips hovering above Nonce Gear!)
        const p1 = E.io(seg(t, 252.5, 255.2));
        const p2 = E.io(seg(t, 261.8, 264.5));
        const panX = lerp(0, -560, p1) + lerp(0, -820, p2);
        tf(chamber, panX, 0);

        // Mechanical Teller stamping arm strikes at 256.8, 257.6, 258.4, 259.2
        const strikes = [256.8, 257.6, 258.4, 259.2].reduce((acc, st) => acc + Math.exp(-Math.pow((t - st) / 0.14, 2)), 0);
        tf(stampArm, 0, strikes * 34);
        const signedNum = clamp(Math.floor(seg(t, 255.2, 260.6) * 50), 0, 50);
        atmCountTxt.textContent = `SIGNING: ${String(signedNum).padStart(2, '0')} / 50`;

        // Staggered card fan reveal
        slips.forEach((sg, idx) => op(sg, E.out(seg(t, 255.6 + idx * 0.28, 256.2 + idx * 0.28))));
        op(fanLabel, E.out(seg(t, 257.2, 257.9)));

        // Nonce Gear rotation + rolling queue counter (#104,881 -> #104,884+)
        nonceGear.setAttribute('transform', `translate(2740 685) rotate(${((t - 250) * 32).toFixed(1)})`);
        const nTick = Math.floor(Math.max(0, t - 262.0) * 0.7);
        nonceReadout.textContent = `#104,${881 + (nTick % 6)}`;
        tf(hoverStack, 2740, 315 + Math.sin(t * 4.5) * 7);
      };
    });
  }
});
