<script type="module">
import * as THREE from 'three';
import { clamp, lerp, ss, mulberry } from '/core/lib.js';

const W = 1920, H = 1080;
window.DUR = 45.0;
const cv = document.getElementById('c');
const x = cv.getContext('2d');

const C = { bg: '#0B0C0E', panel: '#141619', line: '#2E3238', text: '#ECEAE4', dim: '#8B9097', faint: '#4A4F57', acc: '#FF4A2E', paper: '#E4E0D4', ink: '#1D1D1B' };
const F = {
  disp: (px) => `800 ${px}px "Barlow Condensed", sans-serif`,
  sans: (px) => `600 ${px}px "Barlow Condensed", sans-serif`,
  mono: (px) => `600 ${px}px "IBM Plex Mono", monospace`,
  serif: (px) => `700 ${px}px "Newsreader", serif`,
  it: (px) => `italic 500 ${px}px "Newsreader", serif`,
};
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);

// ---------------------------------------------------------------- Load Real Archives
const IM = {};
const loadImg = (src) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const FILES = {
  hq: 'assets/enron_hq.jpg',
  ethics: 'assets/enron_ethics.jpg',
  lay: 'assets/ken_lay.jpg',
  mug: 'assets/skilling_mug.jpg',
  laySig: 'assets/lay_sig.png',
  skSig: 'assets/skilling_sig.png',
  nyse: 'assets/nyse_floor.jpg',
};
await Promise.all([
  ...Object.entries(FILES).map(([k, s]) => loadImg(s).then(i => { IM[k] = i; })),
  document.fonts.ready,
]);

// Procedural grain tiles (visual-investigation §2: 6 x 256^2 tiles)
const GRAIN = [];
for (let g = 0; g < 6; g++) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const gx = c.getContext('2d'), d = gx.createImageData(256, 256), r = mulberry(g * 99 + 7);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 128 + (r() + r() + r() - 1.5) * 115;
    d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255;
  }
  gx.putImageData(d, 0, 0); GRAIN.push(c);
}

// ---------------------------------------------------------------- Three.js 3D LiDAR Scene (dark-documentary)
const glCanvas = document.createElement('canvas');
glCanvas.width = 1200; glCanvas.height = 840;
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setSize(1200, 840, false);
const scene3d = new THREE.Scene();
scene3d.background = new THREE.Color('#07080a');
const cam3d = new THREE.PerspectiveCamera(38, 1200 / 840, 0.5, 400);

// Starfield
const starGeo = new THREE.BufferGeometry();
const starPos = [];
const Rs = mulberry(404);
for (let i = 0; i < 600; i++) starPos.push((Rs()-0.5)*220, Rs()*90+10, (Rs()-0.5)*220);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene3d.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x8b9097, size: 0.45 })));

// Topographic wireframe ground
const gGeo = new THREE.PlaneGeometry(140, 140, 36, 36);
gGeo.rotateX(-Math.PI / 2);
scene3d.add(new THREE.LineSegments(new THREE.WireframeGeometry(gGeo), new THREE.LineBasicMaterial({ color: 0x1f242c })));

// Enron Tower wireframe
const towerGeo = new THREE.BoxGeometry(8, 30, 8, 4, 12, 4);
const tower = new THREE.LineSegments(new THREE.WireframeGeometry(towerGeo), new THREE.LineBasicMaterial({ color: 0x9aa4b2 }));
tower.position.set(0, 15, 0);
scene3d.add(tower);

// 4 Offshore Shell Entities (LJM1, LJM2, RAPTOR, CHEWCO) linked by red beams
const SPE_POS = [[-22, 9, -14], [24, 11, -12], [-20, 7, 18], [22, 10, 16]];
const speMeshes = [];
for (const [sx, sy, sz] of SPE_POS) {
  const sg = new THREE.BoxGeometry(4.5, 6, 4.5, 2, 3, 2);
  const sm = new THREE.LineSegments(new THREE.WireframeGeometry(sg), new THREE.LineBasicMaterial({ color: 0xff4a2e }));
  sm.position.set(sx, sy, sz);
  scene3d.add(sm);
  speMeshes.push(sm);

  const lGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 18, 0), new THREE.Vector3(sx, sy, sz)]);
  scene3d.add(new THREE.Line(lGeo, new THREE.LineBasicMaterial({ color: 0xff4a2e })));
}

function render3D(t) {
  const a = (t - 13.5) * 0.22;
  cam3d.position.set(Math.sin(a) * 58, 26 + Math.sin(a * 0.5) * 4, Math.cos(a) * 58);
  cam3d.lookAt(0, 12, 0);
  renderer.render(scene3d, cam3d);
}

// ---------------------------------------------------------------- Drawing Primitives
let FR = 0;
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function hair(x0, y0, x1, y1, c = C.line, w = 1, dash) {
  x.save(); x.strokeStyle = c; x.lineWidth = w; if (dash) x.setLineDash(dash);
  x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore();
}
function rect(X, Y, w, h, c = C.line, lw = 1) { x.strokeStyle = c; x.lineWidth = lw; x.strokeRect(X + .5, Y + .5, w - 1, h - 1); }

function txt(s, X, Y, o = {}) {
  x.save();
  x.font = o.font || F.sans(o.s || 24);
  x.fillStyle = o.c || C.text;
  x.globalAlpha *= (o.a ?? 1);
  x.textAlign = o.al || 'left';
  x.textBaseline = o.bl || 'alphabetic';
  x.fillText(s, X, Y);
  x.restore();
}

function tagChip(label, X, Y) {
  fill(X, Y - 12, 6, 12, C.acc);
  txt(label, X + 14, Y, { font: F.mono(15), c: C.dim });
}

// Unified archival plate (grade + grain + white cut-in flash)
function plate(img, X, Y, w, h, o = {}) {
  x.save();
  fill(X, Y, w, h, '#000');
  if (img) {
    const push = o.push || 1.0;
    const iw = img.width, ih = img.height;
    const sc = Math.max(w / iw, h / ih) * push;
    const dw = iw * sc, dh = ih * sc;
    const dx = X + (w - dw) * (o.fx ?? 0.5);
    const dy = Y + (h - dh) * (o.fy ?? 0.5);
    x.beginPath(); x.rect(X, Y, w, h); x.clip();
    x.filter = o.doc ? 'grayscale(1) contrast(1.08) brightness(0.88)' : 'grayscale(1) contrast(1.22) brightness(0.94)';
    x.drawImage(img, dx, dy, dw, dh);
    x.filter = 'none';
    if (GRAIN.length) {
      x.globalCompositeOperation = 'overlay';
      x.globalAlpha = o.doc ? 0.12 : 0.22;
      const g = GRAIN[FR % 6];
      for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy);
    }
  }
  x.restore();
  if (o.flash > 0) { x.save(); x.globalAlpha = o.flash; fill(X, Y, w, h, '#fff'); x.restore(); }
  rect(X, Y, w, h, o.border || C.line, 1);
}

// Clockwise red callout circle + leader label
function ring(cx, cy, r, k, label, side = 1, sub) {
  if (k <= 0) return;
  x.save(); x.strokeStyle = C.acc; x.lineWidth = 3;
  x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); x.stroke(); x.restore();
  if (label && k > 0.55) {
    const a = seg(k, 0.55, 0.75);
    const lx = cx + side * (r * 0.72), ly = cy - r * 0.72, ex = lx + side * 48, ey = ly - 32;
    x.save(); x.globalAlpha *= a; hair(lx, ly, ex, ey, C.acc, 1.8); hair(ex, ey, ex + side * 16, ey, C.acc, 1.8); x.restore();
    txt(label, ex + side * 24, ey + 6, { font: F.sans(24), al: side > 0 ? 'left' : 'right', a });
    if (sub) txt(sub, ex + side * 24, ey + 30, { font: F.mono(15), c: C.dim, al: side > 0 ? 'left' : 'right', a });
  }
}

// Optical Loupe (archive-lighttable) magnifying real source pixels
function drawLoupe(img, imgX, imgY, imgW, imgH, lx, ly, r, mag = 2.2) {
  x.save();
  // Drop shadow
  x.shadowColor = 'rgba(0,0,0,0.75)'; x.shadowBlur = 34; x.shadowOffsetY = 14;
  x.beginPath(); x.arc(lx, ly, r, 0, Math.PI * 2); x.fillStyle = '#000'; x.fill();
  x.shadowColor = 'transparent';
  x.clip();
  // Compute source crop
  const u = (lx - imgX) / imgW, v = (ly - imgY) / imgH;
  const sw = img.width / mag * (r * 2 / imgW);
  const sh = img.height / mag * (r * 2 / imgH);
  x.filter = 'grayscale(1) contrast(1.25) brightness(0.98)';
  x.drawImage(img, u * img.width - sw / 2, v * img.height - sh / 2, sw, sh, lx - r, ly - r, r * 2, r * 2);
  x.filter = 'none';
  // Red highlight bar inside loupe
  x.fillStyle = 'rgba(255, 74, 46, 0.25)';
  x.fillRect(lx - r, ly - 16, r * 2, 34);
  x.restore();
  // Bevel rim
  x.save();
  x.strokeStyle = '#181a1f'; x.lineWidth = 10; x.beginPath(); x.arc(lx, ly, r, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = C.acc; x.lineWidth = 2.5; x.beginPath(); x.arc(lx, ly, r + 5, 0, Math.PI * 2); x.stroke();
  x.restore();
}

// White-inverted signature helper
function drawSig(img, X, Y, w, h) {
  if (!img) return;
  x.save();
  x.filter = 'invert(1) contrast(2.0)';
  x.globalCompositeOperation = 'screen';
  x.drawImage(img, X, Y, w, h);
  x.restore();
}

// ---------------------------------------------------------------- Sound / Cue Events
window.EV = [
  { t: 0.2,  type: 'sub' },
  { t: 4.0,  type: 'shutter' },
  { t: 8.5,  type: 'loupe' },
  { t: 13.5, type: 'scan' },
  { t: 19.5, type: 'shutter' },
  { t: 25.5, type: 'impact' },
  { t: 32.0, type: 'tick_run' },
  { t: 38.5, type: 'resolve' },
];

// ---------------------------------------------------------------- Main Render(t)
const STOCK = [[1996, 21.5], [1997, 20.75], [1998, 28.5], [1999, 44.38], [2000.6, 90.56], [2001.1, 80.0], [2001.8, 13.9], [2001.92, 0.26]];

window.render = (t) => {
  t = clamp(t, 0, 45.0);
  FR = Math.floor(t * 24);
  fill(0, 0, W, H, C.bg);

  // 1. 0.0 - 4.0 s: Cold Open (Real Houston HQ + $90.56 -> $0.26)

    const fl = Math.max(0, 1 - t / 0.16);
    tagChip('PHOTO · ENRON COMPLEX, HOUSTON', 60, 52);
    plate(IM.hq, 60, 68, 1140, 940, { push: 1.0 + t * 0.015, flash: fl });
    // Right editorial panel
    fill(1240, 68, 620, 940, C.panel); rect(1240, 68, 620, 940, C.line);
    fill(1240, 68, 620, 4, C.acc);
    txt('VISUAL INVESTIGATION', 1290, 135, { font: F.mono(18), c: C.acc });
    txt('ENRON CORP.', 1290, 225, { font: F.disp(76) });
    txt('THE $74 BILLION ILLUSION', 1290, 280, { font: F.sans(32), c: C.dim });
    hair(1290, 340, 1810, 340, C.line);
    const k = seg(t, 1.0, 3.2);
    const px = lerp(90.56, 0.26, Math.pow(k, 1.6));
    txt('NYSE: ENE', 1290, 430, { font: F.mono(20), c: C.dim });
    txt(`$${px.toFixed(2)}`, 1290, 560, { font: F.disp(148), c: k > 0.5 ? C.acc : C.text });
    txt(k > 0.5 ? 'DEC 2001 · CHAPTER 11' : 'AUG 2000 · PEAK SHARE PRICE', 1290, 620, { font: F.mono(18), c: k > 0.5 ? C.acc : C.dim });
    ring(820, 440, 120, seg(t, 0.8, 2.2), 'ENRON TOWERS', -1, '1400 SMITH ST, HOUSTON');
  }
  // 2. 4.0 - 8.5 s: Two Architects + Real Signatures
  else if (t < 8.5) {
    const lt = t - 4.0, fl = Math.max(0, 1 - lt / 0.16);
    tagChip('DOSSIER · EXECUTIVE LEADERSHIP', 60, 52);
    // Left: Ken Lay
    plate(IM.lay, 60, 68, 870, 660, { push: 1.02 + lt * 0.01, fy: 0.25, flash: fl });
    fill(60, 748, 870, 260, C.panel); rect(60, 748, 870, 260, C.line);
    txt('KENNETH LAY · CHAIRMAN & CEO', 100, 805, { font: F.mono(20), c: C.acc });
    drawSig(IM.laySig, 100, 840, 360, 115);
    ring(495, 390, 155, seg(lt, 0.6, 1.8));
    // Right: Jeffrey Skilling (DOJ Mugshot)
    plate(IM.mug, 990, 68, 870, 660, { push: 1.02 + lt * 0.01, fy: 0.2, flash: fl });
    fill(990, 748, 870, 260, C.panel); rect(990, 748, 870, 260, C.line);
    txt('JEFFREY SKILLING · CEO (2001) · CONVICTED 2006', 1030, 805, { font: F.mono(20), c: C.acc });
    drawSig(IM.skSig, 1030, 840, 340, 130);
    ring(1425, 380, 160, seg(lt, 1.2, 2.4));
  }
  // 3. 8.5 - 13.5 s: Archive Light Table Loupe on Real Enron Code of Ethics
  else if (t < 13.5) {
    const lt = t - 8.5, fl = Math.max(0, 1 - lt / 0.16);
    tagChip('ARCHIVE · ENRON CODE OF ETHICS (2000)', 60, 52);
    plate(IM.ethics, 60, 68, 1240, 940, { doc: true, flash: fl });
    // Optical Loupe landing on the booklet
    const lScale = seg(lt, 0.4, 1.2);
    if (lScale > 0) {
      const lx = lerp(520, 680, eo(seg(lt, 0.4, 3.8)));
      const ly = lerp(420, 490, eo(seg(lt, 0.4, 3.8)));
      drawLoupe(IM.ethics, 60, 68, 1240, 940, lx, ly, 210 * eo(lScale), 2.3);
    }
    fill(1340, 68, 520, 940, C.panel); rect(1340, 68, 520, 940, C.line);
    txt('EXHIBITS // A-01', 1380, 130, { font: F.mono(18), c: C.acc });
    txt('“Code of Ethics”', 1380, 210, { font: F.serif(54) });
    txt('64 PAGES · SIGNED JULY 2000', 1380, 265, { font: F.mono(18), c: C.dim });
    hair(1380, 310, 1820, 310, C.line);
    txt('“An employee shall not', 1380, 390, { font: F.it(34), c: C.text });
    txt('conduct himself in a manner', 1380, 440, { font: F.it(34), c: C.text });
    txt('which is dishonest.”', 1380, 490, { font: F.it(34), c: C.acc });
    txt('— ENRON CORP. POLICY', 1380, 550, { font: F.mono(16), c: C.dim });
  }
  // 4. 13.5 - 19.5 s: 3D LiDAR Wireframe Reconstruction (dark-documentary)
  else if (t < 19.5) {
    const lt = t - 13.5, fl = Math.max(0, 1 - lt / 0.16);
    render3D(t);
    tagChip('3D RECONSTRUCTION · OFF-BALANCE-SHEET SPE NETWORK', 60, 52);
    x.drawImage(glCanvas, 60, 68, 1200, 940);
    if (fl > 0) { x.save(); x.globalAlpha = fl; fill(60, 68, 1200, 940, '#fff'); x.restore(); }
    rect(60, 68, 1200, 940, C.line);
    // Right panel
    fill(1300, 68, 560, 940, C.panel); rect(1300, 68, 560, 940, C.line);
    txt('SHADOW ENTITIES', 1340, 135, { font: F.mono(18), c: C.acc });
    txt('$38 BILLION', 1340, 245, { font: F.disp(110), c: C.acc });
    txt('HIDDEN OFF BALANCE SHEET', 1340, 300, { font: F.mono(18), c: C.dim });
    const spes = ['LJM1 (1999)', 'LJM2 (1999)', 'CHEWCO INVESTMENTS', 'RAPTOR VEHICLES I–IV'];
    for (let i = 0; i < spes.length; i++) {
      const on = seg(lt, 0.8 + i * 0.7, 1.2 + i * 0.7);
      if (on <= 0) continue;
      const yy = 400 + i * 110;
      fill(1340, yy, 480, 76, '#0B0C0E'); rect(1340, yy, 480, 76, C.acc);
      txt(spes[i], 1370, yy + 48, { font: F.mono(22), a: on });
    }
  }
  // 5. 19.5 - 25.5 s: 3-Column Sync Grid (NYSE Floor + Stock Playhead + Debt)
  else if (t < 25.5) {
    const lt = t - 19.5, fl = Math.max(0, 1 - lt / 0.16);
    tagChip('SYNC GRID · MARKET HYPE VS. FILED REALITY', 60, 52);
    // Col 1: NYSE Photo
    plate(IM.nyse, 60, 68, 580, 640, { push: 1.03 + lt * 0.01, flash: fl });
    fill(60, 728, 580, 280, C.panel); rect(60, 728, 580, 280, C.line);
    txt('LOC · WALL STREET', 90, 780, { font: F.mono(16), c: C.dim });
    txt('+$979M', 90, 875, { font: F.disp(92), c: C.text });
    txt('REPORTED 2000 NET INCOME', 90, 920, { font: F.mono(16), c: C.dim });
    // Col 2: Stock Chart with Playhead
    fill(670, 68, 580, 940, C.panel); rect(670, 68, 580, 940, C.line);
    txt('NYSE: ENE (1996–2001)', 710, 125, { font: F.mono(18), c: C.dim });
    const k = seg(lt, 0.4, 5.0);
    x.save(); x.strokeStyle = C.acc; x.lineWidth = 4; x.beginPath();
    for (let i = 0; i < STOCK.length; i++) {
      const sx = 720 + ((STOCK[i][0] - 1996) / 6) * 480;
      const sy = 860 - (STOCK[i][1] / 95) * 620;
      if (i === 0) x.moveTo(sx, sy); else x.lineTo(sx, sy);
    }
    x.stroke();
    const phX = 720 + k * 480;
    hair(phX, 180, phX, 880, C.acc, 2, [8, 6]);
    x.restore();
    // Col 3: Hidden Reality
    fill(1280, 68, 580, 940, C.panel); rect(1280, 68, 580, 940, C.line);
    txt('OCT 16, 2001 · Q3 FILING', 1320, 130, { font: F.mono(18), c: C.acc });
    const showLoss = seg(lt, 2.5, 3.2);
    if (showLoss > 0) {
      txt('-$618M', 1320, 320, { font: F.disp(130), c: C.acc, a: showLoss });
      txt('QUARTERLY LOSS ADMITTED', 1320, 380, { font: F.mono(18), a: showLoss });
      hair(1320, 430, 1800, 430, C.line);
      txt('-$1.2B', 1320, 560, { font: F.disp(110), c: C.acc, a: showLoss });
      txt('SHAREHOLDER EQUITY WRITE-DOWN', 1320, 615, { font: F.mono(18), a: showLoss });
    }
  }
  // 6. 25.5 - 32.0 s: The Crash (Freeze, Circle, Chapter 11)
  else if (t < 32.0) {
    const lt = t - 25.5, fl = Math.max(0, 1 - lt / 0.16);
    tagChip('TIMELINE · 47 DAYS TO BANKRUPTCY', 60, 52);
    fill(60, 68, 1800, 940, C.panel); rect(60, 68, 1800, 940, C.line);
    if (fl > 0) { x.save(); x.globalAlpha = fl; fill(60, 68, 1800, 940, '#fff'); x.restore(); }
    const dates = [
      ['OCT 16, 2001', '$33.84', 'Q3 $618M LOSS ANNOUNCED'],
      ['OCT 22, 2001', '$20.65', 'SEC OPENS FORMAL INQUIRY'],
      ['NOV 08, 2001', '$8.41',  '5 YEARS OF EARNINGS RESTATED'],
      ['DEC 02, 2001', '$0.26',  'CHAPTER 11 BANKRUPTCY ($63.4B)'],
    ];
    for (let i = 0; i < 4; i++) {
      const on = seg(lt, 0.3 + i * 1.2, 0.7 + i * 1.2);
      if (on <= 0) continue;
      const yy = 210 + i * 195;
      hair(140, yy + 40, 1780, yy + 40, C.line);
      txt(dates[i][0], 140, yy, { font: F.mono(28), c: i === 3 ? C.acc : C.dim, a: on });
      txt(dates[i][1], 560, yy, { font: F.disp(76), c: i === 3 ? C.acc : C.text, a: on });
      txt(dates[i][2], 920, yy, { font: F.sans(40), c: C.text, a: on });
    }
  }
  // 7. 32.0 - 38.5 s: Human Cost (Dots for People + Mugshot)
  else if (t < 38.5) {
    const lt = t - 32.0, fl = Math.max(0, 1 - lt / 0.16);
    tagChip('IMPACT · WORKFORCE & INVESTORS', 60, 52);
    fill(60, 68, 1220, 940, C.panel); rect(60, 68, 1220, 940, C.line);
    const p = seg(lt, 0.3, 4.5);
    const R = mulberry(77);
    for (let ry = 140; ry < 920; ry += 32) {
      for (let rx = 120; rx < 1220; rx += 32) {
        const hit = R() < p;
        x.strokeStyle = hit ? C.acc : C.faint; x.lineWidth = hit ? 2 : 1.5;
        x.beginPath(); x.arc(rx, ry, hit ? 6 : 3, 0, Math.PI * 2);
        if (hit) x.stroke(); else { x.fillStyle = C.faint; x.fill(); }
      }
    }
    fill(140, 380, 1060, 260, 'rgba(11,12,14,0.92)'); rect(140, 380, 1060, 260, C.acc);
    txt('20,000+ EMPLOYEES', 670, 505, { font: F.disp(116), al: 'center' });
    txt('$2.1 BILLION IN PENSIONS WIPED OUT', 670, 580, { font: F.mono(24), c: C.acc, al: 'center' });

    plate(IM.mug, 1320, 68, 540, 620, { fy: 0.2, flash: fl });
    fill(1320, 708, 540, 300, C.panel); rect(1320, 708, 540, 300, C.line);
    txt('SENTENCING · 2006', 1360, 770, { font: F.mono(18), c: C.acc });
    txt('24 YEARS', 1360, 880, { font: F.disp(104) });
    txt('JEFFREY SKILLING · FEDERAL PRISON', 1360, 940, { font: F.mono(16), c: C.dim });
  }
  // 8. 38.5 - 45.0 s: Evidence Map (All Real Sources Converging)
  else {
    const lt = t - 38.5, fl = Math.max(0, 1 - lt / 0.16);
    tagChip('EVIDENCE MAP · ENRON CORP. (2001)', 60, 52);
    fill(60, 68, 1800, 940, C.panel); rect(60, 68, 1800, 940, C.line);
    const thumbs = [
